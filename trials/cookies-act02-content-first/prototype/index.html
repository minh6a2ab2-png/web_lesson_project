<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cookies · ACT02 — Hai lần ghé thăm</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#142537;background:#f4f7fb;--blue:#1762ad;--ink:#142537;--muted:#526274;--line:#dce5ef;--paper:white}*{box-sizing:border-box}body{margin:0;line-height:1.55;min-height:100vh;display:flex;flex-direction:column}button,select,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #ec9d31;outline-offset:3px}.top{display:flex;align-items:center;justify-content:space-between;padding:10px clamp(16px,3vw,48px);background:#fff;border-bottom:1px solid var(--line);gap:12px}.top .brand{font-weight:800;font-size:.9rem}.top .sub{color:var(--muted);font-size:.8rem}.top .tools{display:flex;gap:8px;align-items:center}.tool{border:1px solid var(--line);background:#fff;color:#203f5a;border-radius:9px;padding:8px 12px;font-size:.83rem}.progress{height:4px;background:#e3eaf3}.progress i{display:block;height:100%;background:var(--blue);transition:width .2s}main{width:100%;max-width:1090px;margin:auto;padding:clamp(18px,3vw,42px) 18px 30px;flex:1}.eyebrow{font-size:.79rem;text-transform:uppercase;letter-spacing:.08em;color:#1762ad;font-weight:800}.hero h1{font-size:clamp(1.55rem,3.6vw,2.65rem);line-height:1.18;letter-spacing:-.035em;margin:11px 0}.lead{font-size:clamp(1.03rem,1.7vw,1.22rem);max-width:820px;color:#344b60;margin-top:12px}.term{font-weight:750;color:#164f83}code{font-family:ui-monospace,Consolas,monospace;font-size:.92em;background:#eaf2fc;padding:.12rem .35rem;border-radius:5px}.stage{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,34px);margin-top:24px;box-shadow:0 12px 35px rgba(42,68,98,.045)}.stage h2{font-size:1.2rem;margin:0 0 10px}.subline{font-size:.94rem;color:var(--muted)}.actors{display:grid;grid-template-columns:1fr minmax(190px,1.6fr) 1fr;align-items:center;gap:22px;margin:25px 0 10px}.actor{border:2px solid #d5e7f6;border-radius:16px;padding:18px 10px;text-align:center;background:#f3f9ff}.actor.server{background:#f8f5ff;border-color:#e2d9fa}.actor .emoji{font-size:2.8rem}.actor strong{display:block}.arrow{text-align:center}.arrow .arr{font-size:clamp(2.2rem,5vw,4.2rem);color:#1762ad;line-height:1}.arrow .arr.reverse{color:#7f4fa5}.arrow small{display:block;color:var(--muted)}.takeaway{background:#ecf5ff;border-left:4px solid #1762ad;border-radius:8px;padding:15px 18px;margin-top:19px;font-size:1.02rem}.next-clue{margin-top:20px;padding:14px 0;border-top:1px solid var(--line);color:#46596b}.micro{color:var(--muted);font-size:.92rem}.diagram-annotate{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}.header-card{background:#152e45;color:white;border-radius:14px;padding:18px;font-size:1.06rem}.header-card code{background:#294965;color:#fff;padding:6px 10px;display:block;margin:10px 0}.annotated{display:grid;gap:12px}.annotated div{background:#f2f7fc;padding:12px 15px;border-radius:10px}.annotated b{color:#155897}.pill{display:inline-block;border-radius:100px;padding:5px 12px;font-size:.85rem;background:#e6f3ff;color:#11598f;font-weight:700}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:19px 0}.action{border:none;background:#1762ad;color:#fff;border-radius:10px;padding:12px 17px;font-weight:750}.action.secondary{background:#e7f1fc;color:#174e7f}.action.neutral{background:#eff2f5;color:#25455f}.action:disabled{opacity:.5;cursor:not-allowed}.choice{border:2px solid var(--line);background:#fff;border-radius:12px;padding:13px 16px;text-align:left;color:#253c50}.choice[aria-pressed="true"]{border-color:#1762ad;background:#eef6ff;font-weight:750}.message{border-radius:10px;padding:13px 16px;background:#f1f6fb;color:#1d3853;margin:12px 0}.message.success{background:#e9f6ef;color:#145b38}.message.warn{background:#fff1db;color:#7c4b0e}.compare{display:grid;grid-template-columns:1fr 1fr;gap:16px}.case{background:#f5f9fd;border:1px solid var(--line);border-radius:14px;padding:18px}.case h3{margin-top:0}.case .state{font-size:1.08rem;font-weight:800;color:#135d97}.case .state.no{color:#9b492e}.timeline{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:21px 0}.step{padding:12px;border-radius:12px;background:#f1f5fa;flex:1;text-align:center;font-size:.9rem}.step.active{background:#ddecfb;color:#165c9d;font-weight:800}.quiz{display:grid;gap:12px;margin-top:20px}.quiz .choice{width:100%}.recall{background:#f9fbfd;border:2px dashed #c8dbea;border-radius:18px;padding:24px;text-align:center}.recall p{font-size:1.08rem}.recall .directions{display:flex;align-items:center;justify-content:center;gap:16px;margin:20px 0}.recall .directions span{font-size:1.45rem}.answer{display:none}.answer.visible{display:block}.bridge{background:#f2f6fb;border-radius:12px;padding:13px 17px;margin:25px 0 0;color:#334d63;font-size:.94rem}.footer{position:static;margin-top:auto;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px clamp(16px,3vw,40px);gap:10px}.footer .counter{font-size:.88rem;color:var(--muted)}.help{border:1px solid var(--line);border-radius:12px;padding:20px;background:#fff;margin-top:18px}.help[hidden],section[hidden]{display:none!important}.help summary{font-weight:700;cursor:pointer}.help p{margin:10px 0 0}#content{animation:appear .15s ease}@keyframes appear{from{opacity:.4}to{opacity:1}}@media(max-width:690px){.diagram-annotate,.compare{grid-template-columns:1fr}.actors{grid-template-columns:1fr 1fr;gap:8px}.actors .arrow{grid-column:1/-1;grid-row:2}.actors .actor.server{grid-column:2;grid-row:1}.actors .actor:first-child{grid-column:1;grid-row:1}.stage{padding:16px}.top .sub{display:none}.case{padding:12px}.hero h1{font-size:1.7rem}.footer{padding:8px 12px}.footer .counter{font-size:.78rem}.top{padding:10px 12px}}

</style></head><body><header class="top"><div><div class="brand">COOKIES <span style="font-weight:500;color:#678">/ ACT02</span></div><div class="sub">Một câu chuyện xuyên suốt: website nhớ lựa chọn Tiếng Việt</div></div><div class="tools"><button class="tool" id="help-toggle" aria-expanded="false" aria-controls="help">Giải thích thêm</button><button class="tool" id="overview">Tổng quan</button></div></header><div class="progress"><i id="progress"></i></div><main><div id="content"></div><aside class="help" id="help" hidden><strong>Trợ giảng theo ngữ cảnh</strong><p id="help-text"></p><div class="bar"><button class="action secondary" id="close-help">Đóng</button></div></aside></main><footer class="footer"><button class="action neutral" id="prev">← Trước</button><span class="counter" id="counter"></span><button class="action" id="next">Tiếp →</button></footer>
<script>
const state={page:0,predictAccept:null,predictReturn:null,accept:null,returnChoice:null,quizChoice:null,recallAttempt:false,recallVisible:false,runAccept:false,runReturn:false,quizChecked:false};
const pages=['A2-01','A2-02','A2-03','A2-04','A2-05','A2-06'];
const helpTexts=[
'Browser là ứng dụng mở trang web (ví dụ Chrome). Server là hệ thống cung cấp nội dung. Request là lời yêu cầu, Response là lời phản hồi. Hãy nhìn theo hướng mũi tên.',
'Đừng cần nhớ cú pháp ngay. “Set-Cookie” là tên một chỉ dẫn trong HTTP Response. “language” là tên thông tin; “vi” biểu diễn lựa chọn tiếng Việt trong ví dụ này.',
'Ở đây em chỉ thử mô hình giả lập, không thay đổi Cookie của Chrome. Hãy dự đoán trước; rồi chọn nhận hoặc chặn và bấm Chạy thử.',
'Một Cookie đã lưu chỉ được gửi lại khi còn phù hợp, còn hạn và đáp ứng điều kiện gửi. Trong ví dụ này là lần quay lại cùng website, không mô phỏng tất cả quy tắc bảo mật.',
'Ghi nhớ hai chiều khác nhau: Set-Cookie nằm trong Response từ Server; Cookie có thể nằm trong Request từ Browser. Khi bị chặn, không có Cookie đó để gửi lại.',
'Em có thể chỉ tay hoặc vẽ hai mũi tên trên giấy. Nếu muốn, ghi nhớ trước rồi mới chọn “Xem đối chiếu”. Việc xem đối chiếu không đồng nghĩa đã thành thạo.'
];
function shell(k,title,lead,inner,bridge){return `<div class="hero"><div class="eyebrow">${k}</div><h1>${title}</h1><p class="lead">${lead}</p></div>${inner}<div class="bridge">${bridge}</div>`}
function browserAndServer(label,reverse=false){return `<div class="actors"><div class="actor"><div class="emoji">🖥️</div><strong>Browser</strong><small>Trình duyệt của em</small></div><div class="arrow"><div class="arr ${reverse?'reverse':''}">${reverse?'⟵':'⟶'}</div><strong>${label}</strong></div><div class="actor server"><div class="emoji">🗄️</div><strong>Server</strong><small>Máy chủ website</small></div></div>`}
const renderers=[
()=>shell('01 · Khởi đầu','Ai bắt đầu khi em mở một website?','Để một website nhớ lựa chọn ngôn ngữ, trước tiên ta xem Browser và Server liên lạc thế nào.',`<div class="stage"><h2>Hai bên tham gia</h2><p>Em mở trang học ngoại ngữ bằng <span class="term">Browser</span> (trình duyệt). <span class="term">Server</span> là hệ thống cung cấp trang web. Browser gửi lời yêu cầu gọi là <span class="term">HTTP Request</span>.</p>${browserAndServer('HTTP Request')}<div class="takeaway"><strong>Ghi nhớ:</strong> Browser <b>gửi Request</b> để xin nội dung. Server <b>trả Response</b> (phản hồi). Đây là kiến thức nền để hiểu Cookie.</div></div>`,'Màn kế tiếp: trong Response từ Server có thể xuất hiện dữ liệu gì giúp website nhớ Tiếng Việt?'),
()=>shell('02 · Phản hồi từ máy chủ','`Set-Cookie` xuất hiện ở đâu?','Đây là lần đầu em chọn tiếng Việt. Server có thể gửi chỉ dẫn lưu một thông tin nhỏ trong HTTP Response.',`<div class="stage"><div class="diagram-annotate"><div>${browserAndServer('HTTP Response + Set-Cookie',true)}<p class="micro">Mũi tên màu tím đi từ <b>Server về Browser</b>.</p></div><div><div class="header-card"><strong>Ví dụ một dòng trong HTTP Response</strong><code>Set-Cookie: language=vi</code><small>Ví dụ minh họa, không phải dữ liệu thật của em.</small></div><div class="annotated" style="margin-top:12px"><div><b>Set-Cookie</b> · tên chỉ dẫn Server gửi cho Browser</div><div><b>language</b> · tên thông tin: ngôn ngữ</div><div><b>vi</b> · giá trị: tiếng Việt</div></div></div></div><div class="takeaway"><strong>Điểm chính:</strong> Server <b>có thể</b> gửi <code>Set-Cookie</code> trong <b>Response</b>. Browser chưa chắc lưu; nó có thể chấp nhận hoặc từ chối theo quy tắc và cài đặt.</div></div>`,'Màn kế: Nếu Browser không chấp nhận chỉ dẫn đó, điều gì xảy ra?'),
()=>shell('03 · Thử hai khả năng','Browser có nhất thiết lưu Cookie không?','Cùng một chỉ dẫn `Set-Cookie: language=vi`, nhưng kết quả phụ thuộc việc trình duyệt có chấp nhận lưu hay không.',`<div class="stage"><h2>Thí nghiệm mô phỏng · Lần ghé thăm đầu tiên</h2><p class="subline">Bước 1: Chọn điều em dự đoán. Bước 2: Chọn chính sách nhận/chặn. Bước 3: Nhấn Chạy thử để xem Browser lưu hay không.</p><p><b>Em dự đoán:</b> khi Browser chặn Cookie, kết quả là gì?</p><div class="bar"><button class="choice" aria-pressed="${state.predictAccept==='stored'}" data-pred="stored">Vẫn lưu language=vi</button><button class="choice" aria-pressed="${state.predictAccept==='blocked'}" data-pred="blocked">Không lưu Cookie này</button></div><label><b>Chính sách Browser:</b> <select id="accept-policy"><option value="yes" ${state.accept==='yes'?'selected':''}>Chấp nhận Cookie</option><option value="no" ${state.accept==='no'?'selected':''}>Chặn Cookie</option></select></label><div class="bar"><button class="action" id="run-accept" ${state.predictAccept===null?'disabled':''}>Chạy thử</button><button class="action secondary" id="reset-accept">Thử lại</button></div>${state.runAccept?`<div class="message ${state.accept==='yes'?'success':'warn'}"><strong>Kết quả mô phỏng:</strong> ${state.accept==='yes'?'Browser nhận và lưu language=vi trong mô hình.':'Browser chặn nên không lưu Cookie language=vi.'} ${state.predictAccept==='blocked'?'Dự đoán về trường hợp chặn có cơ sở.':'Hãy so sánh dự đoán với kết quả và thử chính sách Chặn.'}</div>`:'<div class="message">Chưa chạy mô phỏng. Hãy chọn một dự đoán trước.</div>'}<p class="micro">Mô hình này không đọc, ghi hoặc thay đổi Cookie thật của trình duyệt.</p></div>`,'Màn kế: Nếu Cookie được lưu ở lần đầu, nó có thể được gửi lại như thế nào ở lần truy cập thứ hai?'),
()=>shell('04 · Lần quay lại','Cookie đi theo chiều nào ở lượt sau?','Khi mở lại đúng website, Browser có thể gửi dữ liệu đã lưu trở lại Server trong <b>Request</b> — nếu Cookie còn hiệu lực và phù hợp.',`<div class="stage"><div class="pill">Lượt truy cập thứ hai</div><div class="timeline"><div class="step">Lần 1<br>Server gửi Set-Cookie</div><div class="step active">Browser lưu<br>hoặc chặn</div><div class="step">Lần 2<br>Browser gửi Request</div></div><h2>Chọn điều em nghĩ sẽ xảy ra</h2><div class="bar"><button class="choice" data-return="sent" aria-pressed="${state.returnChoice==='sent'}">Đã lưu, còn hiệu lực → có thể gửi Cookie</button><button class="choice" data-return="never" aria-pressed="${state.returnChoice==='never'}">Dù đã lưu cũng không bao giờ gửi</button></div><button class="action" id="run-return" ${state.returnChoice===null?'disabled':''}>Kiểm tra điều kiện</button>${state.runReturn?`<div class="message ${state.returnChoice==='sent'?'success':'warn'}">${state.returnChoice==='sent'?'Đúng trong ví dụ này:': 'Chưa đúng, hãy xem lại điều kiện lưu và gửi.'} Nếu đã lưu và yêu cầu phù hợp, Browser → Server có thể mang <code>Cookie: language=vi</code> trong <b>Request</b>. Nếu bị chặn hoặc không còn hợp lệ, Cookie này không được gửi.</div>${browserAndServer('HTTP Request + Cookie')}`:'<div class="message">Hãy dự đoán rồi kiểm tra. Sơ đồ chiều gửi Cookie sẽ chỉ hiện sau đó.</div>'}</div>`,'Màn kế: Đặt hai trường hợp chấp nhận và chặn cạnh nhau, xem kết quả khác nhau thế nào.'),
()=>shell('05 · So sánh nguyên nhân – kết quả','Vì sao hai lần quay lại có thể khác nhau?','Hai Browser vào cùng một website. Một Browser đã lưu Cookie ngôn ngữ, Browser kia đã chặn Cookie đó.',`<div class="stage"><div class="compare"><div class="case"><h3>Trường hợp A · Chấp nhận</h3><div class="state">Cookie đã lưu</div><p>Ở lần quay lại phù hợp, Browser <b>có thể</b> gửi <code>Cookie: language=vi</code>.</p></div><div class="case"><h3>Trường hợp B · Chặn</h3><div class="state no">Không lưu Cookie này</div><p>Ở lần quay lại, Browser <b>không thể gửi chính Cookie đó</b> vì chưa lưu.</p></div></div><h2 style="margin-top:22px">Chọn lời giải thích phù hợp</h2><div class="quiz"><button class="choice" data-quiz="A" aria-pressed="${state.quizChoice==='A'}">A. Server có thể đọc trực tiếp dữ liệu riêng trong máy em.</button><button class="choice" data-quiz="B" aria-pressed="${state.quizChoice==='B'}">B. Browser chỉ gửi lại Cookie khi Cookie được lưu và điều kiện gửi phù hợp.</button><button class="choice" data-quiz="C" aria-pressed="${state.quizChoice==='C'}">C. Nếu chặn Cookie, chắc chắn mọi cách ghi nhớ trên website đều bị vô hiệu.</button></div><div class="bar"><button class="action" id="check-quiz" ${state.quizChoice===null?'disabled':''}>Đối chiếu lời giải thích</button></div>${state.quizChecked?`<div class="message ${state.quizChoice==='B'?'success':'warn'}">${state.quizChoice==='B'?'Phù hợp.':'Chưa phù hợp.'} Browser quản lý Cookie và gửi lại có điều kiện. Nếu chặn Cookie này, website không thể dựa vào <i>chính Cookie đó</i> để nhớ, nhưng có thể tồn tại cơ chế khác.</div>`:''}</div>`,'Màn cuối của chặng: che sơ đồ và tự nhớ lại hai hướng, rồi xem lời giải đối chiếu.'),
()=>shell('06 · Nhớ lại không nhìn mẫu','Em nhớ được hai chiều Cookie chứ?','Không nhìn các sơ đồ trước. Em hãy nói, viết hoặc vẽ hai mũi tên. Có thể làm trên giấy rồi tự xác nhận đã thử.',`<div class="stage"><div class="recall"><div class="pill">Active Recall · Không xem đáp án trước</div><p><b>1.</b> Trong lượt đầu: <code>Set-Cookie</code> đi từ đâu đến đâu?</p><p><b>2.</b> Ở lượt sau phù hợp: <code>Cookie</code> đi từ đâu đến đâu?</p><p class="micro">Em có thể chỉ tay, vẽ mũi tên trên giấy hoặc nói thành lời. Không phải nhập một đoạn văn dài.</p><div class="bar" style="justify-content:center"><button class="action secondary" id="mark-recall" ${state.recallAttempt?'disabled':''}>Em đã tự trả lời</button><button class="action" id="reveal-recall" ${!state.recallAttempt?'disabled':''}>Xem đối chiếu</button></div>${state.recallVisible?`<div class="answer visible takeaway" style="text-align:left"><b>Đối chiếu:</b><br>• Server → Browser: <code>Set-Cookie</code> trong Response.<br>• Browser → Server: <code>Cookie</code> trong Request phù hợp, khi đã lưu và hợp lệ.<br><span class="micro">Nếu chưa nhớ, thử nói lại không nhìn thêm một lượt.</span></div>`:`<div class="message">${state.recallAttempt?'Em đã ghi nhận một lần tự nhớ; có thể mở đối chiếu.':'Đáp án đang được ẩn để em tự nhớ trước.'}</div>`}</div></div>`,'Chặng tiếp theo ACT03: Cookie đã lưu có thể tồn tại trong bao lâu? Đó là lý do ta học Session và Persistent Cookie.')
];
function render(){document.getElementById('content').innerHTML=renderers[state.page]();document.getElementById('progress').style.width=(state.page+1)/6*100+'%';document.getElementById('counter').textContent=`${state.page+1} / 6 · ${pages[state.page]}`;document.getElementById('prev').disabled=state.page===0;document.getElementById('next').textContent=state.page===5?'Kết thúc chặng ✓':'Tiếp →';document.getElementById('help-text').textContent=helpTexts[state.page];document.getElementById('help').hidden=true;document.getElementById('help-toggle').setAttribute('aria-expanded','false');bind();}
function bind(){document.querySelectorAll('[data-pred]').forEach(b=>b.onclick=()=>{state.predictAccept=b.dataset.pred;render()});document.querySelectorAll('[data-return]').forEach(b=>b.onclick=()=>{state.returnChoice=b.dataset.return;render()});document.querySelectorAll('[data-quiz]').forEach(b=>b.onclick=()=>{state.quizChoice=b.dataset.quiz;state.quizChecked=false;render()});const sel=document.getElementById('accept-policy');if(sel)sel.onchange=e=>state.accept=e.target.value;let e=document.getElementById('run-accept');if(e)e.onclick=()=>{state.accept=sel.value;state.runAccept=true;render()};e=document.getElementById('reset-accept');if(e)e.onclick=()=>{state.runAccept=false;state.accept=null;state.predictAccept=null;render()};e=document.getElementById('run-return');if(e)e.onclick=()=>{state.runReturn=true;render()};e=document.getElementById('check-quiz');if(e)e.onclick=()=>{state.quizChecked=true;render()};e=document.getElementById('mark-recall');if(e)e.onclick=()=>{state.recallAttempt=true;render()};e=document.getElementById('reveal-recall');if(e)e.onclick=()=>{state.recallVisible=true;render()};}
document.getElementById('prev').onclick=()=>{if(state.page>0){state.page--;render();window.scrollTo(0,0)}};document.getElementById('next').onclick=()=>{if(state.page<5){state.page++;render();window.scrollTo(0,0)}else alert('Đã hết phần thiết kế thử ACT02. Chặng tiếp theo là ACT03 — Session/Persistent Cookie.')};document.getElementById('help-toggle').onclick=()=>{let el=document.getElementById('help');el.hidden=!el.hidden;document.getElementById('help-toggle').setAttribute('aria-expanded',String(!el.hidden))};document.getElementById('close-help').onclick=()=>{document.getElementById('help').hidden=true;document.getElementById('help-toggle').focus()};document.getElementById('overview').onclick=()=>alert('ACT02 · 12 phút, sáu màn\n1 Request → 2 Set-Cookie → 3 Chấp nhận/chặn → 4 Lần quay lại → 5 So sánh → 6 Tự nhớ lại.\nĐây là prototype thiết kế riêng ACT02, không lưu câu trả lời và không thao tác cookie thật.');document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('help').hidden){document.getElementById('help').hidden=true;document.getElementById('help-toggle').focus()}});render();
</script></body></html>
