<title id="t">Sơ đồ trống Browser và Web Server / Blank browser-server diagram</title>
<desc id="d">Hai khối Browser bên trái và Web server bên phải, giữa có hai đường nét đứt chưa có mũi tên để học sinh tự ghi hướng request và response. / Two labeled blocks with blank dotted paths for students to determine message directions.</desc>
