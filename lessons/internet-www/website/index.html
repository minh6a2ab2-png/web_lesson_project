<script>
"use strict";
const T=(vi,en)=>state.lang==='en'?en:vi;
const rows=[
['SL-00',8,'The Web Is Down!','Một ngày không có WWW','What would still work if web resources were unavailable?','Nếu các tài nguyên Web không truy cập được, hoạt động nào còn tiếp tục?','Situation'],
['SL-01',8,'Evidence Desk','Bàn nghiên cứu Internet và WWW','Which statements describe networks, and which describe Web resources?','Những bằng chứng nào nói về hạ tầng mạng, những bằng chứng nào nói về tài nguyên Web?','Research'],
['SL-02',5,'Defend Your Model','Bảo vệ sơ đồ khái niệm','Can you explain the Web–Internet relationship in your own words?','Em có thể tự giải thích quan hệ giữa Web và Internet không?','Reason'],
['SL-03',15,'Real Browser Mission','Khám phá trình duyệt thật','Use a real browser to complete a small research mission.','Tự dùng trình duyệt thật để hoàn thành nhiệm vụ nghiên cứu.','Practice'],
['SL-04',8,'URL Investigator','Điều tra cấu trúc URL','What is the same and different in these URLs?','Những URL này giống và khác nhau ở đâu?','Research'],
['SL-05',7,'Decode & Transfer','Giải mã một địa chỉ mới','Can you decode a new URL without a colored guide?','Em có phân tích được URL mới khi chưa có gợi ý tô màu không?','Apply'],
['BREAK',5,'Break','Nghỉ giữa buổi','Rest for five minutes.','Nghỉ 5 phút.','Break'],
['SL-06',4,'DNS Predictions','Dự đoán về DNS','Will a cached answer change a DNS lookup?','Kết quả DNS lưu đệm có làm thay đổi quá trình tra cứu không?','Predict'],
['SL-07',11,'DNS Evidence Lab','Phòng điều tra DNS','Run cases, record evidence and test your predictions.','Chạy các tình huống, ghi bằng chứng và kiểm tra dự đoán.','Investigate'],
['SL-08',3,'DNS Conclusion','Rút kết luận DNS','What does DNS return? When can the next step continue?','DNS trả thông tin gì? Khi nào hành trình có thể tiếp tục?','Reason'],
['SL-09',10,'HTTP Message Lab','Phòng trao đổi HTTP','Who sends the request, and what comes back?','Ai gửi request và điều gì được trả về?','Investigate'],
['SL-10',8,'HTTPS Claim Check','Kiểm chứng giới hạn HTTPS','What does an HTTPS connection prove—and not prove?','Kết nối HTTPS chứng minh được và không chứng minh được điều gì?','Evaluate'],
['SL-11',6,'Browser Rendering','Khám phá cách hiển thị trang','How does the same HTML change with CSS and JavaScript?','Cùng một HTML thay đổi thế nào với CSS và JavaScript?','Explore'],
['SL-12',4,'Browser Data','Trình duyệt lưu những gì?','Can you distinguish history, cache, cookies and bookmarks?','Em phân biệt được history, cache, cookies và bookmarks không?','Sort'],
['SL-13',13,'Build the Web Journey','Tự xây dựng hành trình Web','Assemble, explain and defend the journey from URL to page.','Tự ghép, giải thích và bảo vệ hành trình từ URL tới trang web.','Create'],
['SL-14',5,'Exit Ticket','Đánh giá cuối buổi','Explain independently what you now understand.','Hãy tự giải thích những gì em đã hiểu.','Assess']
];
const lessonSlides=rows.map(r=>({id:r[0],mins:r[1],titleEn:r[2],titleVi:r[3],promptEn:r[4],promptVi:r[5],type:r[6]}));
const blank={lang:'vi',idx:0,fields:{},choices:{},checks:{},reviewed:{},recall:{},tabHints:{},dns:{trial:'A',index:0,events:[],done:{},selectedIP:null},http:{case:'200',index:0,events:[],done:{}},renderer:0,renderClick:false,journey:['Browser identifies host and path','User enters URL','Browser renders response','DNS address lookup when needed','Server returns response','Browser connects and sends HTTP request'],branch:'cache',selfRating:''};
let state;
try {let data=localStorage.getItem('web-lesson-5.1');state=data?Object.assign(structuredClone(blank),JSON.parse(data)):structuredClone(blank);}catch(e){state=structuredClone(blank)}
if(!Array.isArray(state.journey)||state.journey.length!==6)state.journey=structuredClone(blank.journey);
state.idx=Math.max(0,Math.min(lessonSlides.length-1,Number(state.idx)||0));
state.dns=Object.assign(structuredClone(blank.dns),state.dns||{});state.http=Object.assign(structuredClone(blank.http),state.http||{});

function save(){try{localStorage.setItem('web-lesson-5.1',JSON.stringify(state))}catch(e){}}
const b=(act,label,value='',cls='btn')=>`<button class="${cls}" data-action="${x(act)}" data-value="${x(value)}">${label}</button>`;
const field=(key,label,placeholder='',rows=2)=>`<div class="field"><label for="f_${x(key)}">${label}</label><textarea id="f_${x(key)}" rows="${rows}" data-field="${x(key)}" placeholder="${x(placeholder)}">${x(state.fields[key]||'')}</textarea></div>`;
const line=(key,label,placeholder='')=>`<div class="field"><label for="f_${x(key)}">${label}</label><input id="f_${x(key)}" data-field="${x(key)}" value="${x(state.fields[key]||'')}" placeholder="${x(placeholder)}"></div>`;
const choice=(key,options,placeholder='—')=>`<select data-choice="${x(key)}" class="choice" aria-label="${x(key)}"><option value="">${x(placeholder)}</option>${options.map(([value,name])=>`<option value="${x(value)}" ${state.choices[key]===value?'selected':''}>${name}</option>`).join('')}</select>`;
const area=(head,body)=>`<section class="panel"><h2 class="sectiontitle">${head}</h2>${body}</section>`;
const hintbtn=()=>b('openDrawer',T('Mở gợi ý','Open hints'),'hints','btn soft sm');
const tag=(s)=>`<span class="pill">${s}</span>`;
function recall(key,items){let ix=state.recall[key]?.idx||0,sh=state.recall[key]?.show||false;let it=items[ix%items.length];return `<section class="recall" aria-label="Active Recall"><div class="recallhead"><strong>${T('Nhớ lại · Nói trước → ghi vở → đối chiếu','Active recall · Say → write → compare')}</strong><span class="pill">${ix+1}/${items.length}</span></div><div class="term">${T(it.vi,it.en)}</div><p class="footnote">${T('Không nhìn tài liệu, hãy nói ý nghĩa và ghi ngắn vào vở.','Without the notes, explain aloud and write briefly in your notebook.')}</p>${sh?`<div class="feedback">${T(it.ansVi,it.ansEn)}</div>`:''}<div class="actions">${b('recallToggle',sh?T('Ẩn đáp án','Hide answer'):T('Đối chiếu đáp án','Check answer'),key,'btn soft sm')}${b('recallNext',T('Từ khóa tiếp','Next cue'),key,'btn sm')}</div></section>`}
const internetRecall=[{vi:'Internet',en:'Internet',ansVi:'Hệ thống toàn cầu gồm các mạng kết nối, hỗ trợ nhiều dịch vụ.',ansEn:'A global network of interconnected networks that supports many services.'},{vi:'World Wide Web',en:'World Wide Web',ansVi:'Hệ thống tài nguyên web liên kết với nhau và sử dụng Internet.',ansEn:'A system of interlinked web resources accessible using the Internet.'},{vi:'Webmail',en:'Webmail',ansVi:'Giao diện email mở trong trình duyệt là ứng dụng web; email không đồng nghĩa WWW.',ansEn:'Email accessed through a browser is a web application; email is not synonymous with the Web.'}];
const browserRecall=[{vi:'Address bar & Tabs',en:'Address bar & Tabs',ansVi:'Thanh địa chỉ mở URL; tab cho phép giữ và chuyển giữa nhiều trang.',ansEn:'The address bar accepts URLs; tabs let users keep and switch pages.'},{vi:'Bookmarks & History',en:'Bookmarks & History',ansVi:'Dấu trang lưu địa chỉ do người dùng chọn; lịch sử ghi trang đã ghé nếu được lưu.',ansEn:'Bookmarks save chosen page addresses; history records visited pages when retained.'},{vi:'Browser ≠ Search engine',en:'Browser ≠ Search engine',ansVi:'Trình duyệt mở và hiển thị nội dung web; công cụ tìm kiếm giúp tìm thông tin.',ansEn:'A browser opens and displays Web content; a search engine helps find information.'}];
const urlRecall=[{vi:'Scheme',en:'Scheme',ansVi:'Phần mô tả cách truy cập, ví dụ https.',ansEn:'Identifies how the resource is accessed, e.g., https.'},{vi:'Host',en:'Host',ansVi:'Định danh đích, ví dụ school.example.org.',ansEn:'Identifies the destination, e.g., school.example.org.'},{vi:'Path',en:'Path',ansVi:'Đường dẫn tài nguyên, không nhất thiết là tệp vật lý.',ansEn:'A resource path, not necessarily a physical file.'}];

function cardText(key){let data={
'internet':[T('Internet là hệ thống toàn cầu gồm nhiều mạng máy tính kết nối với nhau. Thiết bị trao đổi dữ liệu theo những quy tắc truyền thông chung. Website, email và các ứng dụng liên lạc có thể cùng dùng hạ tầng này.','The Internet is a worldwide system of interconnected computer networks. Devices communicate using agreed protocols. Websites, email and communication apps can all use this infrastructure.'),T('Gạch chân cụm mô tả mạng và dịch vụ.','Identify phrases about networks and services.')],
'www':[T('WWW là hệ thống các tài nguyên Web được liên kết và truy cập qua Internet, thường bằng trình duyệt. Web sử dụng Internet nhưng không phải toàn bộ Internet. Webmail là một ứng dụng web; email chuyên dụng có thể dùng các giao thức Internet khác.','The WWW is a system of linked web resources accessed over the Internet, usually through a browser. The Web uses the Internet but is not all of it. Webmail is a web application; a dedicated mail client may use different Internet protocols.'),T('Hãy nêu một ví dụ và một phản ví dụ có giải thích.','Give one example and one contrasting case with a reason.')],
'browser':[T('Browser là phần mềm truy cập và hiển thị tài nguyên web (Chrome, Edge, Firefox). Website là nhóm trang/tài nguyên liên quan; search engine là dịch vụ tìm kiếm. Vị trí tab, History, Bookmark có thể khác nhau theo trình duyệt.','A browser accesses and displays Web content (Chrome, Edge, Firefox). A website is a collection of related pages/resources; a search engine is an information-finding service. Tab, History and Bookmark locations vary across browsers.'),''],
'url':[T('URL xác định tài nguyên và cách truy cập. Trong https://school.example.org/library/books: scheme = https, host = school.example.org, path = /library/books. www và .html không bắt buộc. Path không nhất thiết là tệp thật.','A URL identifies a resource and how to access it. In https://school.example.org/library/books: scheme = https, host = school.example.org, path = /library/books. www and .html are optional. A path does not have to be a physical file.'),''],
'dns':[T('DNS có thể cung cấp bản ghi ánh xạ tên miền với địa chỉ IP. Khi cache hợp lệ, có thể không cần tra cứu lại; DNS không trả HTML. Một tên có thể có nhiều IP. Kết quả trong bài là giả lập.','DNS can provide records mapping hostnames to IP addresses. A valid cache may avoid a new lookup; DNS does not return HTML. A name can have multiple IPs. These lesson results are simulated.'),''],
'http':[T('HTTP mô tả trao đổi yêu cầu và phản hồi giữa client và server. 200 OK là một phản hồi thành công; 404 Not Found cho biết không tìm thấy tài nguyên được yêu cầu. HTTP không phải HTML.','HTTP defines request–response communication between client and server. 200 OK means a successful response; 404 Not Found means the requested resource was not found. HTTP is not HTML.'),''],
'https':[T('HTTPS là HTTP qua kết nối được TLS bảo vệ, giúp bảo vệ dữ liệu khi truyền và hỗ trợ xác thực đầu mối kết nối. Nó không chứng minh người viết trung thực hoặc nội dung chính xác.','HTTPS uses HTTP over a TLS-protected connection, protecting data in transit and supporting endpoint authentication. It cannot prove that the publisher is honest or claims are accurate.'),''],
'render':[T('HTML mang cấu trúc và nội dung, CSS quy định trình bày, JavaScript có thể xử lý hành động và cập nhật trang. Trang web có thể tải thêm ảnh, CSS hay script bằng các yêu cầu riêng.','HTML supplies structure/content, CSS controls presentation, and JavaScript can handle actions and update the page. A page may request additional images, CSS or scripts.'),''],
'data':[T('Bookmark: địa chỉ người dùng chủ động lưu. History: bản ghi trang đã ghé, nếu được lưu. Cache: bản sao tài nguyên dùng lại theo điều kiện. Cookie: dữ liệu nhỏ website có thể lưu và gửi kèm các yêu cầu phù hợp.','Bookmark: a page address deliberately saved. History: a record of visited pages, if retained. Cache: reusable copies of resources under certain rules. Cookie: small pieces of site data that may accompany suitable requests.'),''],
};let d=data[key];return `<div class="source"><strong>${T('Thẻ nghiên cứu','Research card')}</strong><p>${d?.[0]||''}</p>${d?.[1]?`<p class="muted-note">${d[1]}</p>`:''}</div>`}

function slide00(){const opts=[['yes',T('Có thể','Can continue')],['no',T('Không thể','Cannot continue')],['unknown',T('Chưa đủ dữ kiện','Not enough information')]];return `<div class="callout"><strong>${T('Thí nghiệm tư duy, không phải sự cố thật.','Thought experiment, not a real outage.')}</strong> ${T('Giả sử tài nguyên Web không truy cập được nhưng Internet và dịch vụ không phụ thuộc Web vẫn có thể hoạt động.','Assume Web resources cannot be accessed while the Internet and independent non-Web services may still work.')}</div><section class="panel"><div class="grid2">${caseItems.map((c,i)=>`<div class="case"><h3><span class="tag">${i+1}</span> ${T(c.vi,c.en)}</h3>${choice('case'+i,opts)}${i===0||i===4?line('reason'+i,T('Vì sao em nghĩ như vậy?','Why do you think so?'),T('Điều kiện nào làm căn cứ?','Which condition supports your claim?')):''}${state.reviewed['cases']?`<p class="footnote">${T(c.whyVi,c.whyEn)}</p>`:''}</div>`).join('')}</div>${field('openQuestion',T('Một câu hỏi em muốn nghiên cứu tiếp','One question you want to investigate'),'...',2)}<div class="actions">${b('revealCases',state.reviewed.cases?T('Ẩn tư liệu đối chiếu','Hide explanations'):T('Đối chiếu sau khi giải thích','Compare after giving your reasons'),'','btn soft')}</div><p class="footnote">${T('Không chấm điểm kiến thức chưa học; em có thể sửa dự đoán sau khi đọc bằng chứng.','No points are deducted for ideas before the lesson. You may revise your predictions after finding evidence.')}</p></section>`}
function slide01(){return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Nghiên cứu tư liệu','Investigate the sources')}</h2><p>${T('Hãy tự đọc hai thẻ, chỉ ra cụm từ là bằng chứng. Không chép nguyên câu trả lời.','Read both cards, identify evidence, and avoid copying the answer.')}</p><details><summary>${T('Thẻ A · Internet','Card A · Internet')}</summary>${cardText('internet')}</details><div style="height:10px"></div><details><summary>${T('Thẻ B · WWW','Card B · WWW')}</summary>${cardText('www')}</details><div class="actions">${hintbtn()}</div></section><section class="panel"><h2 class="sectiontitle">${T('Hồ sơ nghiên cứu của em','Your investigation record')}</h2>${field('internetClaim',T('Internet là gì? Em dựa vào bằng chứng nào?','What is the Internet? Cite your evidence.'),'...',3)}${field('wwwClaim',T('WWW là gì? Em dựa vào bằng chứng nào?','What is the WWW? Cite your evidence.'),'...',3)}<p class="footnote">${T('Vẽ sơ đồ quan hệ Internet–WWW vào vở; ở màn kế tiếp em sẽ giải thích.','Sketch an Internet–WWW relationship map in your notebook; explain it on the next slide.')}</p></section></div>`}

function slide03(){return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Nhiệm vụ trên trình duyệt thật','Real browser mission')}</h2><p>${T('Dùng Chrome, Firefox hoặc Edge ngay trên máy của em. Không cần đăng nhập, không sử dụng dữ liệu cá nhân.','Use Chrome, Firefox or Edge on your computer. Do not sign in or use personal data.')}</p><div class="mutebox"><p><strong>${T('Cách 1 · Trang công khai','Option 1 · Public pages')}</strong></p><p><a href="https://www.wikipedia.org/" target="_blank" rel="noopener noreferrer">Wikipedia.org</a> · <a href="https://developer.mozilla.org/" target="_blank" rel="noopener noreferrer">MDN Web Docs</a></p><p><strong>${T('Cách 2 · Bản offline trong gói ZIP','Option 2 · Offline pages in the ZIP')}</strong></p><p><a href="./browser_offline/index.html" target="_blank" rel="noopener noreferrer">browser_offline/index.html ↗</a></p><p class="footnote">${T('Nếu dùng file://, các thao tác tab/Back/Bookmark vẫn là chức năng trình duyệt thật; không dùng tệp này để chứng minh DNS/HTTP.','With file://, tabs/Back/bookmarks are genuine browser features; local files do not demonstrate DNS/HTTP.')}</p></div><div class="stack">${browserTasks.map(([key,vi,en])=>`<label class="checkline"><input type="checkbox" data-check="browser_${key}" ${state.checks['browser_'+key]?'checked':''}><span>${T(vi,en)}</span></label>`).join('')}</div><div class="actions">${hintbtn()}</div></section><section class="panel"><h2 class="sectiontitle">${T('Báo cáo phát hiện','Report what you found')}</h2>${field('browserRecord',T('Mục đích → công cụ → kết quả (ít nhất 3 chức năng)','Goal → tool → result (at least 3 functions)'),'...',4)}${line('browserUrl',T('Một URL công khai em đã mở (không chứa thông tin cá nhân)','One public URL you visited (no personal data)'),'https://...')}<p class="footnote">${T('Giải thích: Chrome là browser, còn Google Search là search engine.','Explain: Chrome is a browser, Google Search is a search engine.')}</p>${recall('browser',browserRecall)}</section></div>`}

function slide06(){return `<section class="panel"><h2 class="sectiontitle">${T('Dự đoán trước khi thí nghiệm','Predict before running the experiment')}</h2><p>${T('Cả ba là tình huống trong mô hình lớp học, không phải truy vấn DNS thật. Hãy đọc các điều kiện rồi dự đoán.','These are classroom simulation cases, not real DNS queries. Read the conditions and predict.')}</p><div class="grid3"><div class="case"><h3>A · ${T('Cache trống','Empty cache')}</h3><p>${T('Tên school.example.org chưa có trong cache.','No cached answer for school.example.org.')}</p>${choice('predA',[['query',T('Cần hỏi resolver','Ask resolver')],['reuse',T('Dùng cache','Reuse cache')],['fail',T('Không có địa chỉ','No address')]])}</div><div class="case"><h3>B · ${T('Cache hợp lệ','Valid cache')}</h3><p>${T('Có A record còn hạn: 192.0.2.10.','A valid cached A record: 192.0.2.10.')}</p>${choice('predB',[['query',T('Cần hỏi resolver','Ask resolver')],['reuse',T('Dùng cache','Reuse cache')],['fail',T('Không có địa chỉ','No address')]])}</div><div class="case"><h3>C · ${T('Tên không tồn tại','Name not found')}</h3><p>${T('unknown.school.example.org không có trong dữ liệu DNS giả lập.','unknown.school.example.org is absent from simulated DNS records.')}</p>${choice('predC',[['query',T('Nhận địa chỉ','Receive address')],['nxdomain','NXDOMAIN'],['http404','HTTP 404']])}</div></div>${field('dnsPredictionReason',T('Nêu bằng chứng hoặc lý do dự đoán','Explain your prediction with reasons'),'...',3)}<details><summary>${T('Tư liệu DNS sau khi dự đoán','DNS source after predicting')}</summary>${cardText('dns')}</details></section>`}
const dnsEvents={
A:[['CHECK_CACHE','Check for a cached DNS answer','Kiểm tra kết quả DNS trong cache'],['CACHE_MISS','No valid cached result','Không có cache hợp lệ'],['QUERY_RESOLVER','Contact the simulated resolver','Hỏi resolver giả lập'],['RECEIVE_A','Receive A record: 192.0.2.10','Nhận A record: 192.0.2.10'],['STORE_CACHE','Save the result (sample TTL: 240 s)','Lưu kết quả (TTL mẫu: 240 giây)'],['END_DNS','DNS phase complete','Kết thúc giai đoạn DNS']],
B:[['CHECK_CACHE','Check for a cached DNS answer','Kiểm tra kết quả DNS trong cache'],['CACHE_HIT','Valid cached result exists','Có kết quả lưu đệm hợp lệ'],['RETURN_CACHED_A','Reuse 192.0.2.10 without resolver lookup','Dùng lại 192.0.2.10, không cần hỏi resolver'],['END_DNS','DNS phase complete','Kết thúc giai đoạn DNS']],
C:[['CHECK_CACHE','Check for a cached DNS answer','Kiểm tra kết quả DNS trong cache'],['CACHE_MISS','No valid cached result','Không có cache hợp lệ'],['QUERY_RESOLVER','Contact the simulated resolver','Hỏi resolver giả lập'],['RECEIVE_NXDOMAIN','Simulated domain does not exist','Tên không tồn tại trong vùng giả lập'],['END_DNS','Stop here: no IP address','Dừng tại đây: không có địa chỉ IP']]
};

const httpEvents={'200':[
['PREPARE','Browser prepares a GET request','Trình duyệt chuẩn bị yêu cầu GET'],['SEND','Browser → Server: GET /library/books','Trình duyệt → Server: GET /library/books'],['HANDLE','Server finds the resource','Server tìm được tài nguyên'],['RETURN','Server → Browser: 200 OK; Content-Type: text/html','Server → Trình duyệt: 200 OK; Content-Type: text/html'],['RECEIVE','Browser receives illustrative HTML','Trình duyệt nhận HTML minh họa']],
'404':[
['PREPARE','Browser prepares a GET request','Trình duyệt chuẩn bị yêu cầu GET'],['SEND','Browser → Server: GET /library/missing','Trình duyệt → Server: GET /library/missing'],['HANDLE','Server does not find this resource','Server không tìm thấy tài nguyên yêu cầu'],['RETURN','Server → Browser: 404 Not Found','Server → Trình duyệt: 404 Not Found'],['RECEIVE','Browser may render an error response','Trình duyệt có thể hiển thị nội dung phản hồi lỗi']]

function slide10(){let mode=state.choices.httpsMode||'https';return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Một thông tin trên trang có HTTPS','An HTTPS page makes a claim')}</h2><div class="callout">${T('Một trang có kết nối HTTPS nói: “Mọi thông tin trên trang này đều hoàn toàn chính xác”. Có thể tin lời tuyên bố đó chỉ vì HTTPS không?','An HTTPS page claims: “Everything on this page is completely accurate.” Does HTTPS alone prove this claim?')}</div><div class="field"><label>${T('So sánh loại kết nối','Compare transport modes')}</label>${choice('httpsMode',[['http','HTTP'],['https','HTTPS']])}</div><div class="mutebox"><strong>${mode==='http'?'HTTP':'HTTPS'}</strong><p>${mode==='http'?T('Trong mô hình: thông điệp HTTP không có lớp TLS bảo vệ đường truyền.','In this model: HTTP messages do not use a TLS-protected transport.'):T('Trong mô hình: HTTP trao đổi qua kết nối được TLS bảo vệ. TLS không kiểm tra độ đúng của nội dung trang.','In this model: HTTP travels over a TLS-protected connection. TLS does not validate the truth of page content.')}</p></div>${field('httpsClaim',T('Tự phát biểu: HTTPS bảo vệ gì? Không chứng minh điều gì?','State in your own words: what does HTTPS protect and not prove?'),'...',4)}${b('httpsReveal',state.reviewed.https?T('Ẩn phân tích','Hide comparison'):T('Đối chiếu lập luận','Compare reasoning'),'','btn soft')}${state.reviewed.https?`<div class="feedback">${T('HTTPS hỗ trợ bảo mật dữ liệu khi truyền và xác thực đầu mối kết nối; không chứng minh nội dung đúng hoặc chủ website đáng tin.','HTTPS helps secure data in transit and authenticate the endpoint; it does not prove truthfulness or trustworthiness of the website owner.')}</div>`:''}</section><section class="panel"><h2 class="sectiontitle">${T('Kiểm chứng và ghi nhớ','Evidence and recall')}</h2><details><summary>${T('Thẻ nghiên cứu HTTPS','HTTPS research card')}</summary>${cardText('https')}</details>${recall('http',httpRecall)}</section></div>`}
function slide11(){let level=Number(state.renderer||0);return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Cùng một nội dung HTML','The same HTML content')}</h2><p>${T('Giữ nguyên nội dung; lần lượt bật CSS rồi JavaScript để quan sát điều thay đổi.','Keep the HTML content the same; enable CSS and then JavaScript to observe changes.')}</p><div class="actions">${b('renderLevel',T('Chỉ HTML','HTML only'),'0',level===0?'btn primary':'btn')}${b('renderLevel','HTML + CSS','1',level===1?'btn primary':'btn')}${b('renderLevel','HTML + CSS + JS','2',level===2?'btn primary':'btn')}</div><div class="render-box ${level>0?'styled':''}" aria-live="polite"><h2>${T('Sách thư viện','Library books')}</h2><p>${T('Tìm tài liệu cho dự án học tập.','Find resources for your school project.')}</p><button type="button" data-action="renderClick" ${level===2?'':'disabled'}>${T('Mở','Open')}</button>${level===2&&state.renderClick?`<p><strong>${T('Trạng thái: Đã mở','Status: Item opened')}</strong></p>`:''}</div><p class="footnote">${T('Đây là bản HTML thật được đổi kiểu trình bày; nút chỉ có hành vi khi bật JS.','This uses real HTML with changed styling; the button becomes active only in JS mode.')}</p></section><section class="panel"><h2 class="sectiontitle">${T('Tự phân tích bằng chứng','Analyse what changed')}</h2>${field('renderObservations',T('HTML làm gì? CSS làm gì? Hành vi nào do JavaScript?','What does HTML do, what does CSS change, and what behavior requires JavaScript?'),'...',4)}<details><summary>${T('Thẻ nghiên cứu HTML/CSS/JS','HTML/CSS/JS research card')}</summary>${cardText('render')}</details>${recall('render',renderRecall)}</section></div>`}
const dataCases=[['bookmark','Người học cố ý lưu một địa chỉ để hôm sau quay lại.','A learner deliberately saves a page address for later.'],['history','Muốn xem lại danh sách trang đã ghé trong phiên thường.','A learner wants a list of previously visited pages in a regular session.'],['cache','Trình duyệt tái sử dụng một tệp ảnh đã tải nếu điều kiện cho phép.','A browser reuses a fetched image when caching rules allow.'],['cookie','Website lưu một giá trị nhỏ để gửi kèm những yêu cầu phù hợp sau đó.','A site stores a small value to accompany suitable later requests.']];
function slide12(){let options=[['bookmark','Bookmark'],['history','History'],['cache','Cache'],['cookie','Cookie']];return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Ghép tình huống với khái niệm','Match each situation to its concept')}</h2><div class="stack">${dataCases.map(([v,vi,en],i)=>`<div class="case"><div>${i+1}. ${T(vi,en)}</div><div style="margin-top:8px">${choice('data'+i,options)}</div></div>`).join('')}</div><div class="actions">${b('checkData',T('Kiểm tra sau khi giải thích','Check after explaining'),'','btn soft')}</div>${state.reviewed.data?`<div class="feedback">${T('Đối chiếu: 1 Bookmark · 2 History · 3 Cache · 4 Cookie. Em hãy tự sửa rồi giải thích một trường hợp.','Compare: 1 Bookmark · 2 History · 3 Cache · 4 Cookie. Revise and explain one case.')}</div>`:''}</section><section class="panel"><h2 class="sectiontitle">${T('Vì sao các khái niệm khác nhau?','Why are these different?')}</h2>${field('dataExplanation',T('History và cache khác nhau ở đâu?','How are history and cache different?'),'...',3)}<details><summary>${T('Nguồn nghiên cứu','Research card')}</summary>${cardText('data')}</details>${recall('browserData',browserDataRecall)}</section></div>`}

const orderSolution=['User enters URL','Browser identifies host and path','DNS address lookup when needed','Browser connects and sends HTTP request','Server returns response','Browser renders response'];
function stepLabel(en){let r=journeySteps.find(s=>s.en===en);return r?T(r.vi,r.en):en;}
function slide13(){return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Tự lắp ghép hành trình','Assemble the journey')}</h2><p>${T('Dùng hai nút ↑ ↓ để thay đổi thứ tự. DNS là bước có điều kiện; nhánh HTTP 404 có thể vẫn trả trang lỗi.','Use ↑ ↓ to reorder. DNS lookup is conditional; HTTP 404 may still return an error page.')}</p><div class="cardsort">${state.journey.map((v,i)=>`<div class="sortrow" role="listitem"><span><span class="pill">${i+1}</span> ${stepLabel(v)}</span><button class="btn sm" data-action="journeyMove" data-value="${i}:up" ${i===0?'disabled':''} aria-label="${T('Di chuyển lên','Move up')}">↑</button><button class="btn sm" data-action="journeyMove" data-value="${i}:down" ${i===5?'disabled':''} aria-label="${T('Di chuyển xuống','Move down')}">↓</button></div>`).join('')}</div><div class="field"><label>${T('Chọn một nhánh để giải thích','Choose a conditional branch')}</label>${choice('journeyBranch',[['cache',T('Có cache DNS hợp lệ','Valid DNS cache')],['nxdomain','NXDOMAIN'],['404','HTTP 404']])}</div>${b('checkJourney',T('Kiểm tra mô hình sau khi giảng lại','Check model after teaching'),'','btn soft')}${state.reviewed.journey?`<div class="feedback note">${state.journey.every((v,i)=>v===orderSolution[i])?T('Trật tự khái quát hợp lý. Các ca thực tế có thể có cache, redirect hoặc request phụ.','The broad sequence is reasonable. Real cases may include caches, redirects and extra requests.'):T('Hãy kiểm tra lại quan hệ: xác định tài nguyên, tìm địa chỉ khi cần, gửi yêu cầu, nhận phản hồi, hiển thị.','Review the relationships: identify host and resource, resolve address if needed, request, response, render.')}<p>${branchExplanation()}</p></div>`:''}</section><section class="panel"><h2 class="sectiontitle">${T('Learning by Teaching','Learning by Teaching')}</h2><p>${T('Hãy dùng sơ đồ của em để giảng 2–3 phút cho giáo viên. Đưa bằng chứng từ phần DNS/HTTP và nêu bước có điều kiện.','Teach your model to your tutor for 2–3 minutes. Cite DNS/HTTP evidence and explain a conditional step.')}</p>${field('teachBackNotes',T('Lời giải thích và một điều đã sửa sau câu hỏi phản biện','Your explanation and one correction after feedback'),'...',5)}${recall('journey',[{vi:'URL → DNS → HTTP → Rendering',en:'URL → DNS → HTTP → Rendering',ansVi:'Nhập URL; phân giải tên khi cần; trao đổi HTTP; trình duyệt xử lý và hiển thị nội dung.',ansEn:'Enter URL, resolve a name when needed, exchange HTTP messages, and render content.'}])}</section></div>`}
function branchExplanation(){let choice=state.choices.journeyBranch||'cache';return choice==='cache'?T('Nếu đã có kết quả DNS cache hợp lệ, có thể bỏ qua lần hỏi resolver mới.','With a valid DNS cache, a new resolver lookup may be skipped.'):choice==='nxdomain'?T('Nếu DNS báo NXDOMAIN, không có địa chỉ để tiếp tục HTTP trong mô hình này.','If DNS reports NXDOMAIN, this model cannot proceed to HTTP with an address.'):T('Server có thể phản hồi 404, và trình duyệt vẫn có thể hiển thị trang thông báo lỗi.','A server may return 404, and the browser may still render an error page.')}
function slide14(){let ratings=[['M1',T('Chưa đạt','Not yet')],['M2',T('Đang hình thành','Developing')],['M3',T('Đạt','Meets objective')],['M4',T('Vững','Strong')]];return `<div class="grid2"><section class="panel"><h2 class="sectiontitle">${T('Bài kiểm tra độc lập cuối buổi','Independent exit ticket')}</h2><div class="urlrow">https://library.example.org/help/start</div>${line('exitHost',T('Host là gì?','Identify the host'),'...')}${line('exitPath',T('Path là gì?','Identify the path'),'...')}${field('exitJourney',T('Giải thích ngắn từ URL tới trang hiển thị: bước nào có điều kiện?','Explain briefly how the page loads; which steps are conditional?'),'...',4)}${field('exitHttps',T('Một điều HTTPS không thể chứng minh','One thing HTTPS cannot prove'),'...',2)}${line('exitReview',T('Điều em cần ôn thêm','One topic to review'),'...')}<div class="actions">${b('export',T('Tải hồ sơ học tập (.txt)','Download lesson notebook (.txt)'),'','btn primary')}${b('print',T('In / lưu PDF bằng trình duyệt','Print / save PDF in browser'),'','btn')}</div></section><section class="panel"><h2 class="sectiontitle">${T('Tự đánh giá và chuẩn bị buổi sau','Self-assessment and next session')}</h2>${ratings.map(([id,label])=>`<label class="checkline"><input type="radio" name="rating" data-rating="${id}" ${state.selfRating===id?'checked':''}>${id} · ${label}</label>`).join('')}<div class="separator"></div><p>${T('Sau giờ, tự vẽ mindmap về hành trình WWW, ôn thuật ngữ bằng flashcards và chuẩn bị giải thích một cơ chế cho giáo viên. Bộ bài tập về nhà chi tiết sẽ được xây dựng ở Skill 08.','After class, draw a WWW journey mind map, review terms with flashcards, and prepare to teach one mechanism to your tutor. A full homework set belongs to Skill 08.')}</p>${b('openDrawer',T('Xem flashcards thuật ngữ','Open terminology flashcards'),'flashcards','btn soft')}<div class="callout">${T('Đáp án cuối buổi không hiện tự động; giáo viên đối chiếu theo tiêu chí trong ghi chú giáo viên.','Exit answers are not automatically revealed; the tutor assesses them using the teacher criteria.')}</div></section></div>`}
function sourcesForSlide(){let id=lessonSlides[state.idx].id;if(id==='SL-00')return `<div class="notice">${T('Hãy dự đoán và ghi lý do trước. Nguồn nghiên cứu sẽ xuất hiện ở chặng tiếp theo.','Make your prediction with reasons first. The research sources will appear on the next slide.')}</div>`;if(id==='SL-14')return `<div class="notice">${T('Đây là phần vận dụng độc lập; hãy tự giải thích trước khi quay lại tra cứu.','This is the independent exit task; explain without reference first, then revisit earlier evidence if needed.')}</div>`;let list=id==='SL-01'||id==='SL-02'?['internet','www']:id==='SL-03'?['browser']:id==='SL-04'||id==='SL-05'?['url']:['SL-06','SL-07','SL-08'].includes(id)?['dns']:id==='SL-09'?['http']:id==='SL-10'?['https']:id==='SL-11'?['render']:id==='SL-12'?['data']:['internet','www','url','dns','http','https','render','data'];return list.map(key=>cardText(key)).join('<div style="height:14px"></div>')}
const slideHintTexts={
'SL-00':[['Nhìn điều kiện có nói hoạt động có phụ thuộc Web hay không.','Look for whether the scenario states a dependency on the Web.'],['Ứng dụng email và webmail là hai trường hợp khác nhau.','A dedicated mail client and webmail are different cases.'],['Nếu thiếu điều kiện của một trò chơi, lựa chọn “chưa đủ dữ kiện” là hợp lý.','If the game dependencies are unspecified, “not enough information” may be appropriate.']],
'SL-01':[['Gạch chân “kết nối/mạng” và “tài nguyên Web”.','Underline “networks/connections” and “Web resources”.'],['Tự viết một câu nói Internet hỗ trợ gì, một câu nói WWW cung cấp gì.','Write one sentence about what the Internet supports and one about Web resources.'],['Dùng từ “uses / sử dụng” để nối hai khái niệm, không dùng “equals / bằng nhau”.','Connect them using “uses”, not “equals”.']],
'SL-02':[['Tự lấy một ví dụ Web và một ví dụ khác dùng Internet.','Give one Web example and another Internet service.'],['Phân biệt webmail mở trên trình duyệt với ứng dụng mail chuyên dụng.','Compare browser-based webmail with a dedicated email app.'],['Nói: WWW sử dụng Internet, nhưng Internet còn hỗ trợ các dịch vụ khác.','Say: The Web uses the Internet, but Internet supports other services.']],
'SL-03':[['Xác định mục tiêu trước khi tìm nút cần nhấn.','State your goal before looking for a control.'],['Tab thường ở đầu cửa sổ; History/Bookmarks có thể trong menu.','Tabs are usually at the top; History/Bookmarks may be in a menu.'],['Để lưu trang dùng Bookmark; để xem lại trang đã ghé dùng History (nếu được lưu).','Use Bookmarks to save, History to revisit if recorded.']],
'SL-04':[['Tìm phần URL giữ nguyên giữa hai ví dụ đầu.','Look for the part that stays the same between the first two URLs.'],['Trong địa chỉ mẫu, phần trước dấu gạch đầu tiên sau host là host.','In the sample, the authority/host appears before the path.'],['https là scheme, school.example.org là host, /library/books là path.','https is the scheme, school.example.org the host, and /library/books the path.']],
'SL-05':[['Tách URL thành scheme, host và path.','Split the URL into scheme, host and path.'],['Đừng bắt buộc www hoặc phần mở rộng .html.','Do not require www or an .html extension.'],['Ví dụ: https / library.example.org / /ebooks/topic.','Example: https / library.example.org / /ebooks/topic.']],
'SL-06':[['So sánh việc có và không có kết quả DNS hợp lệ trong cache.','Compare valid cached DNS information with a cache miss.'],['Ca C thiếu tên trong dữ liệu mô phỏng: đó là lỗi DNS, chưa đến HTTP.','In case C the name is absent from simulated DNS; HTTP has not happened.'],['A hỏi resolver; B dùng cache; C có thể trả NXDOMAIN.','A queries the resolver; B reuses cache; C can return NXDOMAIN.']],
'SL-07':[['Thử A và B, quan sát các sự kiện giống/khác.','Run A and B and compare their events.'],['Tìm CHECK_CACHE, QUERY_RESOLVER và RECEIVE_A trong log.','Look for CHECK_CACHE, QUERY_RESOLVER and RECEIVE_A in the log.'],['Ca C không có IP, do đó đừng suy ra lỗi HTTP 404.','Case C has no IP; do not infer HTTP 404.']],
'SL-08':[['Dẫn một dòng log làm bằng chứng.','Cite one event log entry as evidence.'],['Nhìn xem mỗi ca có hỏi resolver không.','See whether each case contacts the resolver.'],['DNS trả thông tin địa chỉ, không trả HTML; NXDOMAIN ≠ HTTP 404.','DNS provides address information, not HTML; NXDOMAIN ≠ HTTP 404.']],
'SL-09':[['Xem hướng của GET và phản hồi.','Look at the direction of GET and the response.'],['Chạy cả hai ca 200 và 404.','Run both the 200 and 404 cases.'],['Client gửi request; server trả response; 404 không đồng nghĩa Internet mất.','Client sends a request; server returns a response; 404 is not an Internet outage.']],
'SL-10':[['Tách độ an toàn đường truyền khỏi độ chính xác nội dung.','Separate transport security from content accuracy.'],['HTTPS sử dụng TLS; TLS không xác minh mọi câu chữ trên trang.','HTTPS uses TLS; TLS does not verify every claim on a page.'],['HTTPS không tự chứng minh trang không lừa đảo.','HTTPS alone cannot prove a site is not deceptive.']],
'SL-11':[['So với chế độ HTML only.','Compare with HTML-only mode.'],['Bật CSS: thay đổi bố cục/định dạng mà không thay nội dung HTML.','Turn on CSS: visual style changes without changing the HTML content.'],['Chỉ chế độ JavaScript cho phép nút đổi trạng thái.','Only JavaScript mode allows the button to change the status.']],
'SL-12':[['Phân biệt lưu địa chỉ với lưu bản sao tài nguyên.','Distinguish saving an address from caching resource copies.'],['History ghi nhận trang từng ghé; Bookmarks là lưu chủ động.','History records visited pages; Bookmarks are deliberate saves.'],['Cache tái sử dụng tài nguyên; Cookie lưu dữ liệu nhỏ của site theo quy tắc.','Cache reuses resources; Cookie stores small site data under rules.']],
'SL-13':[['Hãy tìm dữ liệu đã có từ URL, DNS và HTTP.','Use evidence from URL, DNS and HTTP.'],['Sắp hoạt động của client và server theo chiều sự kiện.','Arrange client/server actions in a plausible order.'],['Phân tích ngoại lệ: cache DNS, NXDOMAIN hoặc HTTP 404.','Explain a branch: cached DNS, NXDOMAIN or HTTP 404.']],
'SL-14':[['Hãy trả lời mà chưa xem lại sơ đồ tham khảo.','Answer without reopening the reference diagrams.'],['Phân biệt lỗi DNS với mã HTTP.','Distinguish DNS failure from HTTP status codes.'],['Giải thích bằng từ ngữ của em và một ví dụ.','Explain in your own words and with an example.']]
};
const teacherTexts={
'SL-00':['Không giải thích định nghĩa trước. Hãy hỏi học sinh điều kiện nào làm căn cứ; trường hợp game mơ hồ phải có lựa chọn chưa đủ dữ kiện.','Do not pre-teach definitions. Ask which stated condition supports the choice; the vague game needs an insufficient-information choice.'],
'SL-01':['Cho học sinh đọc hai thẻ riêng và phát biểu ý bằng lời của mình; tránh đọc thẻ thay. Sản phẩm: 2 nhận định có bằng chứng.','Let the learner read and formulate two evidence-backed claims; do not read the cards aloud for them.'],
'SL-02':['Mời học sinh giảng sơ đồ 1 phút. Chỉ mở sơ đồ chuẩn sau khi trình bày. Phản biện về webmail, không bắt học thuộc câu chữ.','Ask the learner to teach their model for a minute. Show the reference diagram afterwards; contrast webmail with mail client.'],
'SL-03':['Quan sát trình duyệt THẬT. Có thể dùng trang offline trong gói; không tự động truy cập History hoặc cookie của học sinh. Đạt khi giải thích được ≥3 chức năng.','Observe a REAL browser. Offline pages are available; never access learner history/cookies. Success: explain at least three features.'],
'SL-04':['Trước khi phát thẻ URL, học sinh so sánh các ví dụ. Chấp nhận trả lời sai và yêu cầu chỉ ra bằng chứng.','Have learner compare examples before opening the URL reference. Allow revisions based on evidence.'],
'SL-05':['Phân tích URL lạ; host library.example.org, path /ebooks/topic. Địa chỉ mẫu sau đó dùng riêng school.example.org, không khẳng định máy chủ thật.','Transfer URL: host library.example.org, path /ebooks/topic. The next model uses school.example.org separately, not a live site.'],
'SL-06':['Chỉ giao ba điều kiện, không nói đáp án DNS. Ưu tiên so sánh cache hit và miss.','Give the three conditions without giving DNS answers. Prioritize cache-hit vs cache-miss comparison.'],
'SL-07':['Mời học sinh đọc log, dẫn sự kiện. A và B cần quan sát; C thêm nếu kịp. GIF chỉ minh họa phụ, không phải mô phỏng điều tra.','Learner should cite log entries; A and B essential, C if time. GIF is a supplement, not the investigation.'],
'SL-08':['Không cho IP từ NXDOMAIN. Địa chỉ ở A/B là dải ví dụ 192.0.2.10.','Never derive an IP from NXDOMAIN. A/B use documentation IP 192.0.2.10.'],
'SL-09':['Để chạy trao đổi HTTP gắn với hành trình, cần chọn IP ví dụ từ DNS A/B. Quan sát 200 và 404.','For an HTTP exchange tied to the journey, select the sample IP from DNS A/B. Inspect 200 and 404.'],
'SL-10':['Hỏi: HTTPS bảo vệ đường truyền, có xác minh sự thật của câu chữ không? Không diễn tả khóa là dấu bảo đảm uy tín.','Ask whether transport protection proves page claims. A padlock is not proof of reputation.'],
'SL-11':['HTML-only, CSS, JS phải giữ cùng nội dung cơ bản; chỉ JavaScript thêm trạng thái sau khi click.','HTML only, CSS and JS should share the same base content; only JS adds a status on click.'],
'SL-12':['Chỉ nghiên cứu khái niệm cookie nhập môn; session/persistent chuyên sâu chưa có trang sách. Không lấy dữ liệu thật.','Treat cookies at introductory level; detailed session/persistent cookies were not in supplied pages. Do not inspect personal data.'],
'SL-13':['Học sinh tự ghép trước khi mở lời đối chiếu. Nhấn mạnh cache có thể bỏ qua DNS lookup, DNS error không tự ra HTTP 404.','Learner assembles before comparison. A cache may skip a lookup; DNS failure is not HTTP 404.'],
'SL-14':['Dùng rubric M1–M4. Host=library.example.org, path=/help/start; cần giải thích DNS (khi cần), HTTP và hiển thị. Skill08 bài tập về nhà chưa chạy.','Use M1–M4 rubric. Host=library.example.org, path=/help/start; explain DNS (if needed), HTTP and rendering. Full homework (Skill08) is pending.']
};

['WWW','Hệ thống các tài nguyên Web liên kết và sử dụng Internet.','A system of linked Web resources that uses the Internet.'],
['Browser','Phần mềm truy cập và hiển thị nội dung web.','Software that accesses and displays Web content.'],
['URL','Địa chỉ xác định tài nguyên và cách truy cập.','An address identifying a resource and how to access it.'],
['Host','Tên xác định đích trong URL.','The destination identifier in a URL.'],
['DNS','Hệ thống cung cấp bản ghi tên miền, gồm thông tin địa chỉ.','A system providing domain records including address information.'],

['HTTP','Giao thức trao đổi request và response.','A protocol for request–response exchange.'],
['HTTPS','HTTP qua kết nối có TLS bảo vệ.','HTTP over a TLS-protected connection.'],
['HTML','Ngôn ngữ mô tả cấu trúc nội dung.','A language describing document content structure.'],
['CSS','Ngôn ngữ quy định cách trình bày.','A language describing presentation and layout.'],
['JavaScript','Ngôn ngữ dùng cho logic và tương tác trang web.','A language used for Web page logic and interaction.']
];
function renderDrawer(){let root=document.getElementById('drawerRoot');if(!drawer){root.innerHTML='';return}let hdr={source:T('Nguồn nghiên cứu','Research sources'),hints:T('Gợi ý theo mức','Progressive hints'),teacher:T('Ghi chú giáo viên','Teacher notes'),notebook:T('Hồ sơ học tập','Learning notebook'),flashcards:T('Flashcards thuật ngữ','Terminology flashcards')}[drawer]||drawer;let body='';if(drawer==='source'){body=sourcesForSlide()+`<p class="footnote">${T('Tư liệu được biên soạn lại theo MDN, Cloudflare Learning Center và tài liệu của tổ chức liên quan. Xem README trong gói cho nguồn và giấy phép.','Sources paraphrase MDN, Cloudflare Learning Center and related references. See package README for attribution.')}</p>`}
if(drawer==='hints'){let id=lessonSlides[state.idx].id;let levels=slideHintTexts[id]||[];let level=state.tabHints[id]||0;body=`<p>${T('Chỉ mở mức gợi ý tiếp theo khi cần. Hãy thử tự làm trước.','Open the next level only when needed. Try independently first.')}</p>${levels.slice(0,level).map(([vi,en],i)=>`<div class="source"><strong>H${i+1}</strong><p>${T(vi,en)}</p></div>`).join('')}<div class="actions">${b('nextHint',T('Mở thêm gợi ý','Reveal next hint'),'', 'btn primary')} ${b('clearHints',T('Ẩn gợi ý','Hide hints'),'','btn')}</div>`}
if(drawer==='teacher'){body=`<div class="callout">${T('Ghi chú dùng cho giáo viên, không phải màn hình học sinh. Không phải không gian bảo mật.','For tutor facilitation, not learner-facing content. This is not a secure space.')}</div><h3>${lessonSlides[state.idx].id} · ${T('Mục tiêu tổ chức','Facilitation goal')}</h3><p>${T(...(teacherTexts[lessonSlides[state.idx].id]||['Nghỉ giữa buổi; không thêm nhiệm vụ.','Take a real break without extra tasks.']))}</p><h3>${T('Nhắc lại nguyên tắc','Principle')}</h3><p>${T('Nêu nhiệm vụ → học sinh tự nghiên cứu/trình bày → đặt câu hỏi phản biện → chuẩn hóa phần còn sai. Không đọc toàn bộ học liệu thay học sinh.','State the task → learner investigates/explains → ask probing questions → correct only what is needed. Do not lecture through the cards.')}</p>`}
if(drawer==='notebook'){let entries=Object.entries(state.fields||{}).filter(([k,v])=>String(v).trim());let checks=Object.entries(state.checks||{}).filter(([k,v])=>v);body=`<div class="actions">${b('export',T('Tải ghi chép (.txt)','Download notes (.txt)'),'','btn primary')}${b('resetConfirm',T('Xóa dữ liệu trên thiết bị này','Clear local session'),'','btn')}</div><div class="callout">${T('Ghi chép chỉ lưu cục bộ trong trình duyệt nếu trình duyệt cho phép. Không gửi lên máy chủ.','Notes are stored locally in this browser when supported; no data is sent to a server.')}</div><p><strong>${entries.length}</strong> ${T('ô ghi chép','saved responses')} · <strong>${checks.length}</strong> ${T('nhiệm vụ đã đánh dấu','checked tasks')}</p>${entries.length?entries.map(([k,v])=>`<details><summary>${x(k)}</summary><p style="white-space:pre-wrap">${x(v)}</p></details>`).join(''):`<p>${T('Em chưa ghi nội dung nào.','No notes entered yet.')}</p>`}`}
if(drawer==='flashcards'){let i=state.flashIndex||0,fc=flashcards[i%flashcards.length];body=`<div class="mutebox"><div class="eyebrow">${i+1} / ${flashcards.length}</div><h2 style="font-size:30px">${x(fc[0])}</h2><p>${T('Hãy tự nói định nghĩa rồi mới mở.','Define it aloud before revealing the answer.')}</p>${state.flashRevealed?`<div class="feedback">${T(fc[1],fc[2])}</div>`:''}</div><div class="actions">${b('flashFlip',state.flashRevealed?T('Ẩn nghĩa','Hide answer'):T('Hiện nghĩa','Reveal answer'),'','btn soft')}${b('flashNext',T('Thẻ tiếp','Next card'),'','btn primary')}</div><p class="footnote">${T('Tự vẽ mindmap kết nối các thẻ, không chỉ học thuộc rời rạc.','Draw a mind map linking the cards, not only isolated definitions.')}</p>`}
root.innerHTML=`<div class="drawer-bg" data-action="closeDrawer"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="${x(hdr)}"><div class="drawer-header"><h2>${hdr}</h2>${b('closeDrawer',T('Đóng ✕','Close ✕'),'','btn sm')}</div><div class="drawer-body">${body}</div></aside>`}
function render(){let current=lessonSlides[state.idx];document.documentElement.lang=state.lang;document.getElementById('viBtn').setAttribute('aria-pressed',state.lang==='vi');document.getElementById('enBtn').setAttribute('aria-pressed',state.lang==='en');document.getElementById('brandSub').textContent=T('Hành trình khám phá Web','Explore how the Web works');document.getElementById('notebookBtn').innerHTML='▤ '+T('Hồ sơ','Notebook');document.getElementById('sourceBtn').innerHTML='◧ '+T('Học liệu','Sources');document.getElementById('teacherBtn').innerHTML='⚙ '+T('Giáo viên','Teacher');document.getElementById('prevLabel').textContent=T('Trước','Back');document.getElementById('nextLabel').textContent=state.idx===lessonSlides.length-1?T('Hoàn thành','Finish'):T('Tiếp','Next');document.getElementById('prevBtn').disabled=state.idx===0;document.getElementById('nextBtn').disabled=state.idx===lessonSlides.length-1;document.getElementById('progressbar').style.width=`${Math.round(100*(state.idx+1)/lessonSlides.length)}%`;let jump=document.getElementById('jump');jump.innerHTML=lessonSlides.map((s,i)=>`<option value="${i}" ${i===state.idx?'selected':''}>${s.id==='BREAK'?T('Nghỉ 5 phút','5-min break'):`${s.id.replace('SL-','')} · ${state.lang==='en'?s.titleEn:s.titleVi}`}</option>`).join('');let num=state.idx+1;document.getElementById('navposition').innerHTML=`<strong>${current.id==='BREAK'?T('Nghỉ giữa buổi','Break'):x(current.id+' · '+current.mins+T(' phút',' min'))}</strong>${num}/${lessonSlides.length}`;
let content='';if(current.id==='BREAK'){content=`<div class="breakview"><div><div class="eyebrow">${T('Không có nhiệm vụ','No learning task')}</div><h1>${T('Nghỉ 5 phút','5-minute break')}</h1><p>${T('Dừng các mô hình. Em có thể uống nước và quay lại khi sẵn sàng.','All models are paused. Take a break and continue when ready.')}</p>${b('next',T('Tiếp tục bài học','Continue lesson'),'','btn primary')}</div></div>`} else {let idx=Number(current.id.slice(-2));let fn=[slide00,slide01,slide02,slide03,slide04,slide05,slide06,slide07,slide08,slide09,slide10,slide11,slide12,slide13,slide14][idx];content=`<div class="head"><div class="eyebrow">${current.id} · ${T({'Situation':'Tình huống','Research':'Nghiên cứu','Reason':'Giải thích','Practice':'Thực hành','Apply':'Vận dụng','Break':'Nghỉ','Predict':'Dự đoán','Investigate':'Điều tra','Evaluate':'Đánh giá','Explore':'Khám phá','Sort':'Phân loại','Create':'Xây dựng','Assess':'Đánh giá'}[current.type],current.type)} · ${current.mins} ${T('phút','minutes')}</div><h1>${T(current.titleVi,current.titleEn)}</h1><p class="lead">${T(current.promptVi,current.promptEn)}</p></div>${fn()}`}document.getElementById('app').innerHTML=content;renderDrawer();save();}
function stopTimers(){if(timer){clearInterval(timer);timer=null}}
function warn(msg){document.getElementById('announce').textContent=msg;}
function urlSave(){const blob=new Blob([makeNotebook()],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='internet-www-learning-notebook.txt';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
function makeNotebook(){let lines=['INTERNET & WWW — Learning notebook','Language: '+state.lang,''];for(let [k,v] of Object.entries(state.fields))if(String(v).trim())lines.push(k+'\n'+v+'\n');lines.push('Completed browser tasks: '+Object.entries(state.checks).filter(([k,v])=>v).map(([k])=>k).join(', '));lines.push('DNS cases run: '+Object.keys(state.dns.done).filter(k=>state.dns.done[k]).join(', '));lines.push('HTTP cases run: '+Object.keys(state.http.done).filter(k=>state.http.done[k]).join(', '));lines.push('Journey: '+state.journey.join(' → '));lines.push('Self rating: '+state.selfRating);return lines.join('\n')}
function moveLesson(next){stopTimers();state.idx=Math.max(0,Math.min(lessonSlides.length-1,next));drawer=null;render();scrollTo({top:0,behavior:'instant'});document.getElementById('app').focus({preventScroll:true})}
function dnsStep(){if(state.dns.index>=dnsEvents[state.dns.trial].length){stopTimers();return;}state.dns.index++;if(state.dns.index===dnsEvents[state.dns.trial].length){state.dns.done[state.dns.trial]=true;stopTimers()}save();return true}
function httpStep(){if(!state.dns.selectedIP){warn(T('Hãy chọn IP từ DNS trước.','Select a DNS IP first.'));stopTimers();return false;}let evs=httpEvents[state.http.case];if(state.http.index>=evs.length){stopTimers();return false;}state.http.index++;if(state.http.index===evs.length){state.http.done[state.http.case]=true;stopTimers()}save();return true}
function stepAndRender(kind){stopTimers();if(kind==='dns')dnsStep();else httpStep();render()}
function playLab(kind){stopTimers();if(kind==='dns'){if(state.dns.index>=dnsEvents[state.dns.trial].length)return;}else {if(!state.dns.selectedIP){warn(T('Cần có IP từ ca DNS thành công trước khi chạy HTTP.','A successful DNS IP is required before this HTTP simulation.'));return;}if(state.http.index>=httpEvents[state.http.case].length)return;}timer=setInterval(()=>{let ok=kind==='dns'?dnsStep():httpStep();if(ok){render()}else stopTimers()},950)}
function onclickAction(action,value){switch(action){case 'lang':stopTimers();state.lang=value;render();break;case 'prev':moveLesson(state.idx-1);break;case 'next':moveLesson(state.idx+1);break;
case 'openDrawer':previouslyFocused=document.activeElement;drawer=value;renderDrawer();document.querySelector('.drawer .btn')?.focus();break;case 'closeDrawer':drawer=null;renderDrawer();previouslyFocused?.focus();break;
case 'nextHint':{let id=lessonSlides[state.idx].id;state.tabHints[id]=Math.min(3,(state.tabHints[id]||0)+1);renderDrawer();break}case 'clearHints':state.tabHints[lessonSlides[state.idx].id]=0;renderDrawer();break;
case 'recallToggle':{let a=state.recall[value]||{idx:0,show:false};a.show=!a.show;state.recall[value]=a;render();break}case 'recallNext':{let a=state.recall[value]||{idx:0,show:false};let lengths={internet:3,browser:3,url:3,dns:3,http:3,render:3,browserData:2,journey:1};a.idx=((a.idx||0)+1)%lengths[value];a.show=false;state.recall[value]=a;render();break}
case 'revealCases':state.reviewed.cases=!state.reviewed.cases;render();break;case 'showInternetVisual':state.reviewed.internetVisual=!state.reviewed.internetVisual;render();break;case 'checkURL':state.reviewed.urlCheck=true;render();break;case 'showURLVisual':state.reviewed.urlVisual=!state.reviewed.urlVisual;render();break;
case 'dnsStep':stepAndRender('dns');break;case 'dnsPlay':playLab('dns');break;case 'dnsPause':stopTimers();warn(T('Mô phỏng đã tạm dừng.','Simulation paused.'));break;case 'dnsReset':stopTimers();state.dns.index=0;render();break;
case 'selectDNSAddress':if(state.dns.done.A||state.dns.done.B){state.dns.selectedIP='192.0.2.10';render()}else warn(T('Cần hoàn thành ca A hoặc B trước.','Complete case A or B first.'));break;
case 'httpStep':stepAndRender('http');break;case 'httpPlay':playLab('http');break;case 'httpPause':stopTimers();warn(T('Mô phỏng đã tạm dừng.','Simulation paused.'));break;case 'httpReset':stopTimers();state.http.index=0;render();break;
case 'httpsReveal':state.reviewed.https=!state.reviewed.https;render();break;
case 'renderLevel':state.renderer=Number(value);state.renderClick=false;render();break;case 'renderClick':if(Number(state.renderer)===2){state.renderClick=true;render()}break;
case 'checkData':state.reviewed.data=true;render();break;
case 'journeyMove':{let [i,d]=value.split(':'),j=Number(i)+(d==='up'?-1:1);i=Number(i);if(j>=0&&j<state.journey.length){let tmp=state.journey[i];state.journey[i]=state.journey[j];state.journey[j]=tmp;}render();break}
case 'checkJourney':state.reviewed.journey=true;render();break;case 'export':urlSave();break;case 'print':window.print();break;case 'flashFlip':state.flashRevealed=!state.flashRevealed;renderDrawer();break;case 'flashNext':state.flashIndex=((state.flashIndex||0)+1)%flashcards.length;state.flashRevealed=false;renderDrawer();break;
case 'resetConfirm':if(confirm(T('Xóa toàn bộ ghi chép, lựa chọn và kết quả mô phỏng trên trình duyệt này?','Clear all notes, choices, and simulation results in this browser?'))){let keepLang=state.lang;state=structuredClone(blank);state.lang=keepLang;drawer=null;try{localStorage.removeItem('web-lesson-5.1')}catch(e){}render()}break;
default:break;}save()}
document.addEventListener('click',ev=>{let el=ev.target.closest('[data-action]');if(!el)return;ev.preventDefault();onclickAction(el.dataset.action,el.dataset.value||'')});
document.addEventListener('input',ev=>{let el=ev.target;if(el.matches('[data-field]')){state.fields[el.dataset.field]=el.value;save()}});
document.addEventListener('change',ev=>{let el=ev.target;if(el.matches('[data-choice]')){state.choices[el.dataset.choice]=el.value;save();if(['httpsMode','journeyBranch'].includes(el.dataset.choice))render()}else if(el.matches('[data-check]')){state.checks[el.dataset.check]=el.checked;save()}else if(el.matches('[data-rating]')){state.selfRating=el.dataset.rating;save()}else if(el.matches('[data-lab]')){stopTimers();if(el.dataset.lab==='dnsTrial'){state.dns.trial=el.value;state.dns.index=0}else if(el.dataset.lab==='httpCase'){state.http.case=el.value;state.http.index=0;}render()}else if(el.id==='jump'){moveLesson(Number(el.value))}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&drawer){drawer=null;renderDrawer();previouslyFocused?.focus()}if(ev.altKey&&ev.key==='ArrowRight'){ev.preventDefault();moveLesson(state.idx+1)}if(ev.altKey&&ev.key==='ArrowLeft'){ev.preventDefault();moveLesson(state.idx-1)}});
window.addEventListener('beforeunload',save);
render();
</script>
</body></html>
