 switch(sl.type){
 case 'situation':return `<p class="stage-hint">${tr('Giả định sư phạm – không phải sự cố thật. Chọn trạng thái và giải thích một trường hợp.','Teaching thought experiment, not a real outage. Choose a result and explain one case.')}</p><div class="case-grid">${[tr('Đọc báo online','Read a news site'),tr('Ứng dụng email riêng','Dedicated email app'),tr('Gọi video chuyên dụng','Dedicated video-call app'),tr('Đọc Wikipedia','Read Wikipedia'),tr('Game online không rõ hạ tầng','Unspecified online game'),tr('Email trên trình duyệt','Webmail in browser')].map((name,i)=>`<div class="case-card ${i===0?'active-case':''}"><strong>0${i+1} · ${name}</strong><p>${tr('Tiếp tục · Không thể · Chưa đủ dữ kiện','Continue · Cannot · Insufficient information')}</p><div class="entry" style="min-height:44px;margin-top:12px">${tr('Lý do của em…','Your reason…')}</div></div>`).join('')}</div>`;
 case 'research':return `<div class="cols">${box(tr('Nguồn để em tự đọc','Sources to explore'),`<div class="card-brief"><strong>CARD-01 · Internet</strong><p>${tr('Hạ tầng kết nối các mạng và thiết bị.','Infrastructure that interconnects networks and devices.')}</p></div><div class="card-brief"><strong>CARD-02 · WWW</strong><p>${tr('Tài nguyên web có liên kết, sử dụng Internet.','Interlinked web resources that use the Internet.')}</p></div><p class="micro">${tr('Hãy chọn câu nào hỗ trợ nhận định của em.','Choose which evidence supports your claim.')}</p>`) }${box(term('evidence'),`<div class="group-title">${tr('Nhận định số 1','Claim #1')}</div>${entry(true)}<div class="group-title" style="margin-top:13px">${tr('Nguồn chứng cứ','Evidence source')}</div>${entry()}`,'soft')}</div>`;
 case 'defend':return `<div class="cols">${box(tr('Sơ đồ do học sinh tạo','Student-built concept map'),`<div class="wire"><div class="two-lanes"><div class="node">Internet</div><span class="connection">↔</span><div class="node purple">WWW</div></div><p class="micro">${tr('Các mũi tên, nhãn và ví dụ là sản phẩm HS phải tự bổ sung.','The learner must add arrow labels, relationships and examples.')}</p></div>`)}${box(tr('Giải thích và phản biện','Explain and defend'),`<div class="card-brief"><strong>${tr('Phản ví dụ','Counterexample')}</strong><p>${tr('Webmail và ứng dụng email chuyên dụng có giống nhau không?','Are webmail and a dedicated email app the same?')}</p></div>${entry(true)}<p class="micro">${tr('Sau khi giảng lại, mới mở sơ đồ tham khảo V01.','Reveal V01 reference diagram only after teach-back.')}</p>`,'soft')}</div>`;
 case 'browser':return `<div class="cols">${box(tr('Mục tiêu trên trình duyệt THẬT','Tasks in a REAL browser'),`<ul class="work-list">${[tr('Mở trang từ thanh địa chỉ','Open a page from its address'),tr('Mở hai trang trong các tab','Keep two pages in tabs'),tr('Dùng liên kết và Back/Forward','Use links and Back/Forward'),tr('Lưu Bookmark của trang học tập','Save a lesson-page bookmark'),tr('Tìm lại trang trong History phiên học','Find a lesson page in session history')].map(y=>`<li><span class="square" aria-hidden="true"></span>${y}</li>`).join('')}</ul><a class="offline-link" href="assets/browser_offline/index.html" target="_blank" rel="noopener">${tr('Mở bộ trang học offline (trình duyệt thật) ↗','Open offline practice pages (real browser) ↗')}</a><div class="micro">${tr('Không yêu cầu lịch sử hoặc tài khoản cá nhân.','Never request private browsing history or accounts.')}</div>`)}${box(tr('Nhật ký quan sát','Observation record'),`<div class="group-title">${tr('Mục đích → Công cụ → Kết quả','Goal → Tool → Outcome')}</div>${entry(true)}<p class="micro">${tr('Học sinh hoặc giáo viên xác nhận thao tác đã quan sát, không tự lấy dữ liệu từ trình duyệt.','Observed tasks are confirmed by learner/teacher, not read automatically from the browser.')}</p>`,'soft')}</div>`;
 case 'url':case 'url2':{let rows=sl.type==='url' ? ['https://school.example.org/library/books','https://school.example.org/library/videos'] : ['https://www.school.example.org/library/index.html','https://school.example.org/library/books'];return `<p class="stage-hint">${tr('Em tự so sánh trước khi mở thẻ giải thích cấu trúc URL.','Compare the examples yourself before opening the URL research card.')}</p><div class="wire">${rows.map((a,i)=>`<div class="lines"><span class="subtle">U${i+1} </span> ${x(a)}</div>`).join('')}<div class="tag-row">${['scheme','host','path','www?','.html?'].map(y=>`<span class="tagmini">${y}</span>`).join('')}</div></div><div class="cols" style="margin-top:14px">${box(tr('Vùng đánh dấu và so sánh','Highlight and compare'),entry(true))}${box(tr('Nhận xét của em','Your explanation'),entry(true),'soft')}</div>`;}
 case 'break':return `<div class="breakscreen"><div><div class="clock">◷</div><h2>${tr('Nghỉ giữa buổi','Short break')}</h2><p>${tr('Không câu hỏi, không trò chơi, không bắt đếm giờ. Chỉ tiếp tục khi sẵn sàng.','No questions, games or forced countdown. Continue when you are ready.')}</p></div></div>`;
 case 'dnsPredict':return `<div class="case-grid">${[['A',tr('Chưa có cache','Cache miss')],['B',tr('Cache còn hạn','Valid cache')],['C',tr('Không có tên miền','Unknown domain')]].map(y=>`<div class="case-card"><strong>DNS-${y[0]}</strong><p>${y[1]}</p><div class="entry" style="margin-top:9px;min-height:60px">${tr('Dự đoán của em…','Your prediction…')}</div></div>`).join('')}</div><p class="micro">${tr('Đây là dữ liệu mô phỏng; school.example.org và 192.0.2.10 không phải địa chỉ để truy cập thật.','This uses simulated data; school.example.org and 192.0.2.10 are not live destinations.')}</p>`;
 case 'dnsLab':case 'dnsReview':return `<div class="labcols">${box(tr('Mô hình DNS – wireframe','DNS lab – wireframe'),`<div class="wire"><div class="two-lanes"><div class="node">Browser</div><span class="connection">→</span><div class="node">Cache</div><span class="connection">→</span><div class="node purple">Resolver</div></div><div class="selection">${tr('Tên: school.example.org | Cache: MISS | Kết quả mẫu: 192.0.2.10','Name: school.example.org | Cache: MISS | Example result: 192.0.2.10')}</div></div><div class="mini-nav" style="margin-top:10px">${['Step','Play','Pause','Reset'].map(fake).join('')}</div><p class="micro">${term('onlyLayout')}</p>`)}${box(tr('Nhật ký bằng chứng','Event log & evidence'),`<div class="log"><div>01 CHECK_CACHE</div><div class="hint">02 CACHE_MISS</div><div>03 QUERY_RESOLVER</div><div>04 RECEIVE_A (192.0.2.10)</div></div><p class="micro">${tr('Trường hợp C: NXDOMAIN → KHÔNG cấp địa chỉ cho HTTP.','Case C: NXDOMAIN → NO address forwarded to HTTP.')}</p>${entry()}`,'soft')}</div>`;
 case 'httpLab':return `<div class="labcols">${box(tr('Hội thoại Client–Server','Client–server conversation'),`<div class="wire"><div class="two-lanes"><div class="node">Browser</div><span class="connection">⇄</span><div class="node purple">Server</div></div><div class="lines">GET /library/books</div><div class="lines">HTTP/1.1 200 OK</div></div><div class="mini-nav" style="margin-top:10px">${['200','404','Step','Reset'].map(fake).join('')}</div><p class="micro">${term('onlyLayout')}</p>`)}${box(tr('Thông điệp và bằng chứng','Messages and evidence'),`<div class="log">&gt; GET /library/books<br><span class="hint">&lt; HTTP 200 OK</span><br>Content-Type: text/html</div>${entry()}`,'soft')}</div>`;
 case 'https':return `<div class="claim-grid">${box(tr('HTTPS giúp bảo vệ gì?','What can HTTPS help protect?'),`<div class="card-brief"><strong>${tr('Gợi ý tư liệu','Source prompt')}</strong><p>${tr('TLS bảo vệ dữ liệu trên đường truyền giữa client và server.','TLS helps secure data in transit between client and server.')}</p></div>${entry(true)}`)}${box(tr('HTTPS KHÔNG chứng minh gì?','What does HTTPS NOT prove?'),`<div class="card-brief"><strong>${tr('Phản ví dụ','Counterexample')}</strong><p>${tr('Một trang HTTPS tuyên bố mọi thông tin đều đúng.','An HTTPS page claims all of its information is correct.')}</p></div>${entry(true)}`,'soft')}</div>`;
 case 'render':return `<div class="splitcols">${box(tr('Cùng một mã HTML','The same HTML source'),`<div class="code-window">&lt;h1&gt;Library books&lt;/h1&gt;\n&lt;p&gt;Find resources.&lt;/p&gt;\n&lt;button&gt;Open&lt;/button&gt;</div>`)}${box(tr('Trạng thái hiển thị','Rendered output'),`<div class="mini-nav">${['HTML only','HTML + CSS','+ JavaScript'].map(fake).join('')}</div><div class="output-window"><h3>Library books</h3><p>Find resources.</p>${fake('Open')}</div><p class="micro">${tr('Mã HTML không thay đổi giữa các trạng thái; nút ở đây chỉ mô tả bố cục.','HTML stays unchanged across stages; the button here illustrates layout only.')}</p>${entry()}`,'soft')}</div>`;
 case 'data':return `<div class="case-grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${[['Bookmark',tr('Tự lưu địa chỉ để mở lại','Save a page for later')],['History',tr('Danh sách trang đã truy cập','Previously visited pages')],['Cache',tr('Tài nguyên tái sử dụng','Reusable cached resources')],['Cookie',tr('Dữ liệu nhỏ gắn với website','Small data associated with a site')]].map(a=>`<div class="case-card"><strong>${a[0]}</strong><p>${a[1]}</p></div>`).join('')}</div><div class="frame-note">${tr('Trong bản thực, thứ tự/tên đáp án bị ẩn cho đến khi HS tự phân loại. Đây là mockup xác định chỗ đặt thẻ.','In the real lesson, answer labels stay hidden until sorting. Here they only show card placement.')}</div>`;
 case 'journey':return `${box(tr('Kho thành phần – học sinh tự nối','Component tray – learner connects'),`<div class="tag-row">${['URL','Browser','DNS?','IP','GET','200 / 404','Render','Cache'].map(y=>`<span class="tagmini">${y}</span>`).join('')}</div>`)}<div class="model-canvas"><div class="node">URL</div><span class="connection">→</span><div class="node">DNS?</div><span class="connection">→</span><div class="node purple">HTTP</div><span class="connection">→</span><div class="node">Render</div></div><div class="frame-note">${tr('Sơ đồ trên chỉ là bố cục canvas. Ở bài giảng thật, học sinh phải tự đặt nút, nhãn và nhánh; có cách thao tác bằng bàn phím.','This is canvas layout only. In the lesson, learners place nodes, labels and branches themselves; keyboard alternatives are required.')}</div>`;
 case 'exit':return `<div class="centerform">${[tr('Phân tích một URL mới','Analyze a new URL'),tr('Giải thích DNS → HTTP → Browser','Explain DNS → HTTP → Browser'),tr('HTTPS bảo vệ gì, không bảo đảm gì?','Explain what HTTPS helps protect and cannot guarantee')].map(y=>`<div class="formrow"><label>${y}</label>${entry()}</div>`).join('')}<div class="callout">${tr('Chưa hiển thị đáp án. Phần bài tập về nhà từ Skill 08 vẫn đang để trống có chủ đích.','Answers are hidden. Homework from Skill 08 is intentionally pending.')}</div></div>`;
 default:return `<p>${term('onlyLayout')}</p>`;
 }
}
function render(){const sl=slides[slideIndex];document.documentElement.lang=locale;document.getElementById('subbrand').textContent=term('subbrand');document.getElementById('previewBadge').textContent=term('previewBadge');document.getElementById('previewNote').textContent=term('previewNote');document.getElementById('helpBtn').textContent='? '+term('help');document.getElementById('bookBtn').textContent='▤ '+term('notebook');document.getElementById('teacherBtn').textContent='♧ '+term('teacher');document.getElementById('eyebrow').textContent=sl.id+' · '+tr('Thiết kế theo nhiệm vụ','Task-centered layout');document.getElementById('pageTitle').textContent=sl.name[locale];document.getElementById('pageQuestion').textContent=sl.q[locale];document.getElementById('pillTime').textContent=sl.minutes+' '+tr('phút','min');document.getElementById('pillType').textContent=tr(({situation:'Tình huống',research:'Nghiên cứu',defend:'Giảng lại',browser:'Công cụ thật',url:'So sánh URL',url2:'Vận dụng',break:'Nghỉ',dnsPredict:'Dự đoán',dnsLab:'Phòng thí nghiệm',dnsReview:'Kết luận',httpLab:'Hội thoại HTTP',https:'Phản biện',render:'So sánh',data:'Phân loại',journey:'Xây mô hình',exit:'Đánh giá'})[sl.type],({situation:'Situation',research:'Research',defend:'Teach-back',browser:'Real tool',url:'URL comparison',url2:'Transfer',break:'Break',dnsPredict:'Prediction',dnsLab:'Evidence lab',dnsReview:'Conclusion',httpLab:'HTTP workshop',https:'Claim check',render:'Comparison',data:'Sorting',journey:'Model builder',exit:'Assessment'})[sl.type]);document.getElementById('slideSelectLabel').textContent=term('slideSelect');document.getElementById('stateLabel').textContent=term('uiState');document.getElementById('slideSelect').innerHTML=slides.map((s,i)=>`<option value="${i}">${s.id} · ${x(s.name[locale])}</option>`).join('');document.getElementById('slideSelect').value=slideIndex;document.getElementById('previewState').innerHTML=['initial','working','compare'].map(v=>`<option value="${v}">${x(term(v))}</option>`).join('');document.getElementById('previewState').value=visualState;document.getElementById('stage').innerHTML=renderType(sl);document.getElementById('position').textContent=`${slideIndex+1}/${slides.length} · ${sl.id}`;document.getElementById('prevBtn').textContent=term('prev');document.getElementById('prevBtn').disabled=slideIndex===0;document.getElementById('nextBtn').textContent=slideIndex===slides.length-1?term('finish'):term('next');document.getElementById('nextBtn').disabled=slideIndex===slides.length-1;document.getElementById('lang').value=locale;if(drawer)showDrawer(drawer,false)}
function goto(i){slideIndex=Math.max(0,Math.min(slides.length-1,i));visualState='initial';closeDrawer();render();document.getElementById('pageTitle').focus();window.scrollTo({top:0,behavior:'instant'})}
function showDrawer(type,storeFocus=true){if(storeFocus)returnFocus=document.activeElement;drawer=type;const sl=slides[slideIndex];const title={help:term('help'),notebook:term('notebook'),teacher:term('teacher')}[type];const sub={help:term('hintsub'),notebook:term('notebooks'),teacher:term('teachersub')}[type];let content='';if(type==='help'){content=`<div class="card-brief"><strong>H1</strong><p>${tr('Em đang cần quan sát hoặc chứng minh điều gì?','What are you trying to observe or prove?')}</p></div><div class="card-brief"><strong>H2</strong><p>${tr('Hãy tìm câu trong nguồn hoặc sự kiện trong log liên quan câu hỏi.','Find the relevant sentence in the source or event in the log.')}</p></div><div class="card-brief"><strong>H3</strong><p>${tr('Hãy thử một trường hợp tương tự nhưng đơn giản hơn trước.','Try a simpler parallel case first.')}</p></div>`}else if(type==='notebook'){content=`<p>${tr('Đây là vị trí dành cho sản phẩm học sinh ở phiên bản thật.','This space will hold learner work in the real lesson.')}</p><div class="entry tall">EV · ${sl.id}</div><p class="micro">${tr('Bản mẫu này không lưu dữ liệu.','This prototype does not save data.')}</p>`}else{content=`<p>${tr('Mục đích: để HS tự hình thành nhận định và chỉ ra bằng chứng.','Goal: learner produces their own explanation and supporting evidence.')}</p><div class="callout">${tr('Không đọc trước định nghĩa. Hỏi: “Em dựa vào đâu?” rồi gợi nguồn nếu cần.','Do not give the definition first. Ask “What evidence supports this?” and point to a source if needed.')}</div><div class="micro">${tr('Skill 07 có lời dẫn, H1–H3, đáp án và tình huống sai chi tiết.','Skill 07 owns the full prompts, H1–H3, expected answers and misconceptions.')}</div>`}
 const overlay=document.getElementById('overlay');overlay.hidden=false;overlay.innerHTML=`<div class="drawer-back" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"><div class="drawer-head"><h2 id="drawerTitle">${x(title)}</h2><button id="drawerClose" type="button" aria-label="${x(term('close'))}" data-close="1">×</button></div><p class="subtle">${x(sub)}</p>${content}<div class="section-mini">${tr('Đang xem','Viewing')}: ${sl.id}</div></aside>`;document.getElementById('drawerClose').focus()}
function closeDrawer(){if(!drawer)return;drawer=null;const overlay=document.getElementById('overlay');overlay.hidden=true;overlay.innerHTML='';if(returnFocus&&typeof returnFocus.focus==='function')returnFocus.focus();returnFocus=null}
document.getElementById('lang').addEventListener('change',e=>{locale=e.target.value;render()});document.getElementById('slideSelect').addEventListener('change',e=>goto(Number(e.target.value)));document.getElementById('previewState').addEventListener('change',e=>{visualState=e.target.value;render()});document.getElementById('prevBtn').addEventListener('click',()=>goto(slideIndex-1));document.getElementById('nextBtn').addEventListener('click',()=>goto(slideIndex+1));document.getElementById('helpBtn').addEventListener('click',()=>showDrawer('help'));document.getElementById('bookBtn').addEventListener('click',()=>showDrawer('notebook'));document.getElementById('teacherBtn').addEventListener('click',()=>showDrawer('teacher'));document.getElementById('overlay').addEventListener('click',e=>{if(e.target.dataset.close)closeDrawer()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});render();
</script>
</body>
</html>
